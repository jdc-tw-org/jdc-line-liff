<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>日本國土開發</title>
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg" />
<link rel="stylesheet" href="assets/ui.css">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="assets/gas-call.js"></script>
<style>
  /* 🔴 色票、body、.card、.btn、.tag、.msg 全部來自 `assets/ui.css`。
     這裡只放**分流頁自己的**東西——不要把共用的再抄一份回來。 */

  /* `h1#who` 是身分槽，不是標題。成功時放的就是那個人的名字
     （擁有者 2026-09-16：「不要寫員工入口，寫上使用者名字就好」）。
     還沒確認出身分時它放狀態句 ⇒ 退回小字，用 19px 粗體喊
     「正在前往 LINE 登入…」會蓋過整頁。 */
  /* 身分列：名字 ＋ 右上角一枚「使用者」。`align-items: flex-start` 讓小標貼齊
     名字的**上緣**，不是垂直置中——「右上角」是擁有者指定的位置。 */
  .me { display: flex; align-items: flex-start; gap: 6px; margin: 0 0 20px; min-height: 28px; }
  h1 { margin: 0; }
  h1.state { font-size: 14px; font-weight: 400; color: var(--ink2); }
  h1.err { color: var(--bad); }
  /* 🔴 這一枚用 `.utag` 不用共用的 `.tag`：`.tag` 是**狀態**標籤（綠正常／紅例外／琥珀待辦），
     而這一枚講的是「這個名字是誰」——借 `.tag` 會讓它看起來像一個狀態。 */
  .utag { font-size: 11px; line-height: 1.6; padding: 0 6px; border-radius: 3px;
          background: var(--g-bg); color: var(--g); font-weight: 600; flex: none;
          position: relative; top: 2px; }


  /* 清單卡：共用的 `.card` 是容器（18px 內距），這一頁的是可點的列。
     ⏹ **九宮格試過又拿掉**（擁有者 2026-09-16 看了實際畫面後「九宮格不做」）。
        留著這句是為了下一個人不要再提一次：方塊化的代價是
        ①頁名被壓成兩行 ②不可點的那幾格放不下「為什麼進不去」而得另外占滿整列。 */
  a.card, .card {
    display: block; padding: 15px 16px; margin-bottom: 10px;
    text-decoration: none; color: inherit;
  }
  a.card:active { border-color: var(--b); }
  .card .name { font-size: 16px; font-weight: 600; color: var(--ink); }
  a.card .name::after { content: ' ›'; color: var(--b); }
  .card .sub { font-size: 13px; color: var(--ink3); margin-top: 4px; }
  /* 🔴 不可點的那幾列刻意做成看得出「這是一個頁面、但現在進不去」，
     不是灰掉到看不見——看不見＝他會以為自己沒有那個權限。 */
  /* 🔴 不可點的那幾列刻意做成看得出「這是一個頁面、但現在進不去」，
     不是灰掉到看不見——看不見＝他會以為自己沒有那個權限。 */
  .card.off { background: #f4f4f2; border-style: dashed; }
  .card.off .name { color: var(--ink2); }
  .tag { margin-left: 6px; vertical-align: 1px; }
  .tag-off  { background: #f0f0ee; color: var(--ink2); }
  .tag-note { background: var(--warn-bg); color: var(--warn); }

  /* 整頁換成一段話時用的方塊（`showMsg`）。共用的 `.msg` 是行內小字，
     這一頁要的是一個有底色的區塊 ⇒ 在這裡加厚，不改共用那份。 */
  .msg { padding: 14px 16px; border-radius: 8px; font-size: 15px; margin: 0 0 14px; }
  .msg-err  { background: var(--bad-bg); color: var(--bad); }
  .msg-info { background: var(--g-bg); color: var(--g); }
  /* 空清單那段有三小段，段落之間要看得出斷點；最後一段不留尾巴以免方塊下緣過胖。 */
  .msg p { margin: 0 0 10px; }
  .msg p:last-child { margin-bottom: 0; }

  .foot { font-size: 13px; color: var(--ink3); margin-top: 24px; line-height: 1.8; }
</style>
</head>
<body>
<div class="brand"><img src="assets/logo-full.svg" alt="日商日本國土開發股份有限公司台灣分公司"></div>
<div class="me"><h1 id="who" class="state">確認身分中…</h1></div>
<div id="list"></div>
<div class="foot" id="foot"></div>

<script>
/**
 * **分流頁**（E1b 第 1 項，2026-09-12）。「我用 LINE 登入，我看得到哪幾頁？」
 *
 * ══ 🔴 這一頁刻意不做什麼 ═════════════════════════════════════════════
 *
 * **① 它不判斷權限。** 清單整份由後端 `listMyPages` 算（權威在 `roles.js` 的
 *    `DISPATCH_PAGES` ＋ `ACTION_ROLES`）。前端自己列一份的話，兩份會分歧，
 *    而分歧的長相是「畫面上有一個點下去會被擋的入口」——他做對了每一件事，
 *    卻被告知沒有權限。
 *
 * **② 它不吃 `?t=`、也不產生任何帶 `?t=` 的連結。**
 *    這一頁存在的前提就是「手上沒有那串亂碼」。做成「登入後發一把 token 給你」
 *    ＝把登入變成憑證發放機，那是 2026-09-12 明確否決掉的方向。
 *    ⇒ 還沒改成 LINE 登入的頁（`lineReady:false`）**列出來但不可點**，
 *      要進去請用原本的舊連結。
 *
 * **③ 未遷移的頁不會被藏起來。** 藏起來的話，「我沒有那個權限」與
 *    「那一頁還沒改好」在畫面上長得一模一樣，而這兩件事的處置相反
 *    （一個要找人開權限，一個是等工程做完）。
 *
 * ══ 🔴 `lineReady` 判準是「**明寫 false** 才不可點」，不是「true 才可點」════
 *
 * 2026-09-14（線 LN）從 `if (p.lineReady)` 改成 `if (p.lineReady !== false)`。
 * 差別只在**這個 key 不存在**的時候，而那正是唯一會出事的那一格：
 *
 *   ⬛ 實測（跑本檔真正那幾行，五列）：
 *      後端照舊送 `lineReady:true` → 可點 5／5、頁尾空白      （兩種寫法相同）
 *      後端**沒有送這個 key**      → 舊寫法：可點 0／5、頁尾「其中 5 頁還沒改成
 *                                   LINE 登入，暫時仍要用原本的連結。」**而且零錯誤訊息**
 *                                   新寫法：可點 5／5、頁尾空白
 *      後端送 `false`              → 那一列變灰（兩種寫法相同 ⇒ 該擋的還是擋得住）
 *
 * 🔴 舊寫法壞掉的樣子不是「沒反應」，是**畫面理直氣壯地說了一句假話**，
 *    把人推去找他可能根本沒有的舊連結。`undefined` 是 falsy，而那與
 *    「後端說這一頁還沒好」在畫面上完全無法分辨。
 * ⇒ 判準改成只認**明確的 `false`**：後端沒講，就不要替它講。
 *
 * ⚠️ 這**不是**「準備要拆掉 `lineReady`」。2026-09-14 使用者拍板**不拆**
 *    （表還在長，下一列非 LINE 頁進來這個欄位就又帶資訊）。這一段是純防禦：
 *    欄位在不在，畫面都不會再靜靜說假話。
 */

var GAS_URL = 'https://script.google.com/macros/s/AKfycbxaDoA_7aOW325p8165VegSqdRL8gRhfTEMfjosdh1A0T4rmzj4Pl7F3k5PToe2po-xtg/exec';
/** 與 index.html／board.html／line.html 同一條 LIFF，不多開（`tools.md`：同一條 LIFF ＋ 參數）。 */
var LIFF_ID = '2010451233-a781rqsm';

/**
 * 後端 `roles.js` `GATE_REJECT` 的代號 → 這一頁要不要給「重新登入」這顆鈕。
 *
 * 🔴 **判斷吃 `reason`，顯示吃後端的 `msg`。**
 *    文案在後端、而且會為了人而改（`deny-no-role.js` 那次實測：拿文案當判準，
 *    11 種措辭有 9 種會讓處置靜默消失）。這一頁只決定「要不要多一顆鈕」。
 *
 * ⚠️ **跨 repo 的手動對齊**（形式沿用 `assets/deny-no-role.js` 的既有慣例）：
 *    這三個字面值來自 `jdc-line-gas` 的 `line-platform/roles.js` `GATE_REJECT`。
 *    兩邊各有測試釘住自己那半，**沒有任何機械的東西逼兩邊相等**。
 *    只改一邊的話兩邊都綠，而這顆鈕靜靜地不再出現（或出現在沒用的地方）。
 * ⚠️ 漏掉一個代號的後果是**少一顆鈕**（看得見、他會來問），不是誤導——
 *    所以這裡刻意用白名單，而不是「除了這幾種以外都給鈕」。
 */
var 重登有用的 = { line_no_token: 1, line_bad_token: 1 };

function el(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
/** 狀態句（確認中／導頁中／失敗）。**不是名字** ⇒ 退回小字，見 CSS 的 `h1.state`。 */
function setWho(t, isErr) {
  var w = el('who'); w.textContent = t; w.className = isErr ? 'state err' : 'state';
  // 狀態句不是一個人 ⇒ 不掛「使用者」那一枚。
  var old = w.parentNode.querySelector('.utag');
  if (old) w.parentNode.removeChild(old);
}
/** 成功：這一格只放名字。`class` 清空 ⇒ 回到 `h1` 的大字。 */
function setName(who) {
  var w = el('who'); w.textContent = who || '已登入'; w.className = '';
  // 🔴 用 DOM 建、不用 `hidden` 屬性：`hidden` 會被作者 CSS 的 display 蓋掉，
  //    而「斷言 hidden===true」的測試照樣綠、使用者照樣看得見（2026-09-16 實測過的坑）。
  var box = w.parentNode, old = box.querySelector('.utag');
  if (old) box.removeChild(old);
  var t = document.createElement('span');
  t.className = 'utag'; t.textContent = '使用者';
  box.appendChild(t);
}
/** 把整頁換成一段話。**永遠說得出「接下來該做什麼」**，不留純粹的「失敗」。 */
function showMsg(msg, reason) {
  var html = '<div class="msg msg-err">' + esc(msg) + '</div>';
  if (reason && Object.prototype.hasOwnProperty.call(重登有用的, reason)) {
    // 🔴 `btn-pri`：共用的 `.btn` 是次要灰鈕（inline-block）。這一顆是整頁唯一的動作，
    //    要滿版主色——改動前它就是滿版的，只掛 `.btn` 會靜靜縮成一顆小灰鈕。
    html += '<button class="btn btn-pri" id="relogin">重新登入</button>';
  }
  el('list').innerHTML = html;
  var b = el('relogin');
  if (b) {
    b.addEventListener('click', function () {
      // 🔴 先登出再登入：只呼叫 login 的話，LINE 會認為「已經登入了」而直接回來，
      //    帶著同一把過期憑證 ⇒ 他會一直按、一直失敗，而畫面每次都說請重新登入。
      try { if (window.liff && liff.isLoggedIn()) liff.logout(); } catch (e) {}
      liff.login({ redirectUri: location.href });
    });
  }
}

/** 畫清單。`lineReady` 決定可不可點（**明寫 false 才不可點**，見檔頭），`note` 決定要不要加一句「這一格還有別的條件」。 */
function render(res) {
  setName(res.who);
  var pages = res.pages || [];
  if (!pages.length) {
    // 🔴 **空清單只代表「這裡列不出東西」，不代表「您沒有頁面可以進」。**
    //    舊文（2026-09-14 改掉，改寫不刪——它記錄了這一格為何要改）：
    //      「您的帳號目前沒有可以進入的頁面。<br>若這不符合預期，請把上面那個名字
    //        一起告訴系統維護者——登入成另一個 LINE 帳號時，畫面看起來也是這樣。」
    //    它壞在兩處，而兩處都是**畫面理直氣壯地說一句假話**（同檔頭 lineReady 那一段）：
    //      ① 「沒有可以進入的頁面」是斷言，而它可能是假的。清單只列後端
    //         `DISPATCH_PAGES` 上有的頁；不在那張表上、但他天天用固定連結進得去的頁，
    //         這裡一個字都不會提。⇒ **有頁可進的人被告知他沒有。**
    //      ② 唯一給出的成因是「你可能登錯 LINE 帳號」。那是**真的可能**，但把它擺在
    //         唯一的位置 ⇒ 他會去查自己的 LINE，查完什麼也沒有，而真正的成因在別處。
    //         （同一個形狀 `jdc-line-gas` 的 `messagingAuthStrict_` 檔頭記過兩次。）
    //    ⇒ 新文的順序是刻意的：**先講這句話的範圍**（這裡列不出來）、
    //      **再給最可能的處置**（原本的連結不受影響，繼續用）、
    //      **最後才是登錯帳號**（可能性真實，但排最後，而且要他自己去看上面那個名字）。
    //
    // ⚠️ **這裡不可以出現任何 page 檔名。** 這一頁不自己維護清單（見檔頭①），
    //    `tests/me-dispatch-wiring.test.js` 有一條直接掃本檔原始碼在釘這件事。
    //    ⇒ 只能泛稱「某個固定連結」，不能寫成「例如 LINE 傳送平台」。
    // ⚠️ 措辭也刻意**不為某一種角色量身訂做**：今天走到這一格的至少有兩種人
    //    （發訊承辦人、hrstats），日後還會有別的。講得只對一種人適用，
    //    對其他人就又變成一句假話。
    el('list').innerHTML = '<div class="msg msg-info">'
      + '<p>這裡沒有可以列給您的頁面。</p>'
      + '<p>這不一定代表您沒有權限——有些頁面是用固定的連結進入的，'
      + '不會出現在這份清單上。如果您平常就是用某個連結進某一頁，'
      + '那條路不受影響，請繼續用原本的連結。</p>'
      + '<p>若您沒有這樣的連結，或這不符合預期，請把上面那個名字告訴系統維護者；'
      + '也請先確認那是不是您本人——登入成另一個 LINE 帳號時，畫面看起來也是這樣。</p>'
      + '</div>';
    return;
  }
  var html = '';
  pages.forEach(function (p) {
    var 副標 = [];
    if (p.note) 副標.push('<span class="tag tag-note">' + esc(p.note) + '</span>');
    if (p.lineReady !== false) {
      html += '<a class="card" href="' + esc(p.page) + '">'
        + '<div class="name">' + esc(p.title) + '</div>'
        + (副標.length ? '<div class="sub">' + 副標.join('') + '</div>' : '')
        + '</a>';
    } else {
      // 🔴 **不可點，而且說得出為什麼與怎麼辦。** 一個點了必定失敗的連結
      //    比沒有連結更糟（board.html 的跨看板切換那一格是同一個判準）。
      副標.unshift('<span class="tag tag-off">尚未支援 LINE 登入</span>');
      html += '<div class="card off">'
        + '<div class="name">' + esc(p.title) + '</div>'
        + '<div class="sub">' + 副標.join('') + '<br>這一頁還要用原本的連結進入。</div>'
        + '</div>';
    }
  });
  el('list').innerHTML = html;
  // 🔴 與上面同一個判準（`=== false`，不是 `!p.lineReady`）。兩處若用不同的述詞，
  //    會出現「卡片可點、頁尾卻說它還沒開放」——同一個判斷散在兩處而沒被要求相等。
  var 未開放 = pages.filter(function (p) { return p.lineReady === false; }).length;
  el('foot').textContent = 未開放
    ? ('其中 ' + 未開放 + ' 頁還沒改成 LINE 登入，暫時仍要用原本的連結。')
    : '';
}

function freshIdToken() {
  if (!(window.liff && typeof liff.getIDToken === 'function')) return '';
  var t = liff.getIDToken();
  return t ? String(t) : '';
}

function load() {
  // ⚠️ 憑證在呼叫當下才取，不是開頁時取一次存起來（它只有效一小時）。
  //    這一頁很短命，但寫法與 board／welfare 一致才不會變成「只有這一頁不一樣」。
  return gasCall(GAS_URL, 'listMyPages', { idToken: freshIdToken() }).then(function (r) {
    if (r && r.ok) { render(r); return; }
    // 🔴 傳輸失敗與「伺服器說不行」要分開講：一個重試有用、一個重試永遠沒用。
    if (r && r.transport) {
      setWho('連不上伺服器', true);
      showMsg((r && r.msg) || '連線失敗。請確認網路後重新整理。', '');
      return;
    }
    setWho('無法確認您的權限', true);
    showMsg((r && r.msg) || '目前無法取得您的頁面清單，請稍後再試。', r && r.reason);
  });
}

function start() {
  if (!(window.liff && typeof liff.init === 'function')) {
    setWho('LINE 元件沒有載入', true);
    showMsg('LINE 的元件沒有載入成功，沒辦法確認您的身分。'
      + '請確認網路正常後重新整理；一直這樣的話請找資訊人員。', '');
    return;
  }
  return liff.init({ liffId: LIFF_ID }).then(function () {
    if (!liff.isLoggedIn()) {
      setWho('正在前往 LINE 登入，登入後會自動回到這一頁…', false);
      liff.login({ redirectUri: location.href });
      return;                                  // 導頁中，不要發車
    }
    if (!freshIdToken()) {
      setWho('拿不到登入憑證', true);
      showMsg('已經登入 LINE，但拿不到這一頁需要的憑證。'
        + '這是 LINE 後台的設定問題，重新整理不會好，請找資訊人員。', '');
      return;
    }
    return load();
  }).catch(function (err) {
    // **不靜默**：否則畫面只會停在「確認身分中…」，而查不出是哪一段。
    setWho('確認身分時失敗', true);
    showMsg('確認身分時失敗：' + ((err && err.message) ? err.message : String(err)), '');
  });
}

start();
</script>
</body></html>
