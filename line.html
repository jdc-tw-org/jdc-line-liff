<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="assets/app.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>LINE訊息發訊</title>
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
<style>
  /* 設計語彙逐項沿用 stats.html（2026-08-16 改版）：低調、簡約、扁平。
     三色各有職責：藍＝可以按的動作、綠＝正常與已完成、紅＝例外與注意。 */
  :root {
    --g: #4a7c62; --g-dk: #3b6650; --g-bg: #eff4f1; --g-ln: #d5e2da;
    --ink: #2c2c2b; --ink2: #6b6b68; --ink3: #9a9a96;
    --bg: #fbfbfa; --ln: #ececea;
    --warn: #8a6a2f; --warn-bg: #f7f2e6;
    --r: #ac1335; --r-dim: #8f3040; --r-bg: #fbeef1;
    --b: #2f4858; --b-dk: #24363f;
    --bad: var(--r-dim); --bad-bg: var(--r-bg);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans TC", sans-serif;
    padding: 20px 16px 40px; font-size: 16px; line-height: 1.65; color: var(--ink);
    background: var(--bg); max-width: 480px; margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }
  .brand { text-align: center; margin: 0 0 16px; }
  .brand img { width: 100%; max-width: 210px; height: auto; }
  .toplinks { text-align: right; margin: 0 0 10px; min-height: 1.4em; }
  .toplinks a { font-size: 13.5px; color: #06c755; text-decoration: none; font-weight: 600; }
  .toplinks a:hover { text-decoration: underline; }
  h1 { font-size: 19px; font-weight: 600; margin: 0 0 10px; color: var(--ink); letter-spacing: .01em; }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 8px; color: var(--ink); letter-spacing: .01em; }
  .meta { font-size: 13px; color: var(--ink3); margin-bottom: 18px; }
  .card { background: #fff; border: 1px solid var(--ln); border-radius: 3px; padding: 18px; margin-bottom: 14px; }
  .msg { font-size: 13.5px; margin-top: 8px; min-height: 1em; white-space: pre-wrap; }
  .msg.ok { color: var(--g); } .msg.err { color: var(--bad); }
  .hint { font-size: 12px; color: var(--ink3); margin: 6px 0 0; line-height: 1.6; }

  /* 收件人數的四個數字。三欄不夠——「有幾個人收不到」要跟「收得到」一樣顯眼。 */
  .grid4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; text-align: center; }
  .num { font-size: 22px; font-weight: 600; color: var(--ink); letter-spacing: -.02em; }
  .num.green { color: var(--g); } .num.red { color: var(--r); } .num.grey { color: var(--ink3); }
  .cap { font-size: 12px; color: var(--ink3); }

  /* 名單：依部門分組。**哪一組看得到由上面的單位格子決定**（#89，見 renderAudience）；
     看得到的那一組本身是展開的。每組標頭一律顯示「N / M 可發送」。

     🔴 **名單自己捲，不撐長整頁。** 137 人全展開時整頁是 7363px＝7.7 個畫面高
     （2026-08-29 用真實人數量的，6 個人的假資料看不出來）——她要捲七個畫面
     才碰得到範本編輯區與送出鈕。固定高度之後，展開或收合都不影響頁面總長。 */
  #audience-list { max-height: 46vh; overflow-y: auto; overscroll-behavior: contain;
                   border: 1px solid var(--ln); border-radius: 3px; padding: 8px; }
  #audience-list .grp:last-child { margin-bottom: 0; }
  .grp { background: #fff; border: 1px solid var(--ln); border-radius: 3px; margin-bottom: 8px; overflow: hidden; }
  .grp summary { padding: 10px 12px; cursor: pointer; font-weight: 600; font-size: 14.5px;
                 list-style: none; display: flex; align-items: baseline; gap: 8px; }
  .grp summary::-webkit-details-marker { display: none; }
  .grp summary::before { content: '›'; color: var(--ink3); font-size: 15px; transition: transform .18s; }
  .grp[open] summary::before { transform: rotate(90deg); }
  .grp .cnt { color: var(--ink3); font-weight: 400; font-size: 13px; margin-left: auto; }
  .grp .body { padding: 0 12px 10px 28px; }
  .pr { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0;
        border-bottom: 1px solid #f4f4f2; font-size: 14.5px; }
  .pr:last-child { border-bottom: none; }
  .pr input[type=checkbox] { width: 18px; height: 18px; margin: 3px 0 0; flex: 0 0 auto; accent-color: var(--b); }
  .pr .nm { font-weight: 600; }
  .pr .no { color: var(--ink3); font-size: 12.5px; margin-left: 6px; }
  /* 不可勾的：顯示但灰掉，並寫出原因。藏起來的話她會以為那個人不在名冊裡。 */
  .pr.off { color: var(--ink3); }
  .pr .why { display: block; font-size: 12px; color: var(--bad); }
  .selbar { display: flex; gap: 8px; align-items: center; margin: 0 0 10px; flex-wrap: wrap; }
  .selbar .n { margin-left: auto; font-size: 13.5px; color: var(--ink2); font-weight: 600; }
  /* display:flex 會蓋掉 [hidden] 的 display:none（同 .otp-box[hidden] 的理由） */
  .selbar[hidden] { display: none; }

  /* 單位格子（#89，2026-09-19 擁有者拍板）。**版面**比照桌位表「依單位」，
     **外觀**沿用本頁 .grp（白底、--ln 框、圓角 3px）——不搬桌位表的灰底綠框。
     🔴 選中／已選一律由 JS 加 class，**不用 :has()**（iOS 15.4 以前不支援）。 */
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 0 0 10px; }
  @media (max-width: 480px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .tile { display: block; width: 100%; background: #fff; border: 1px solid var(--ln); border-radius: 3px;
          padding: 8px 6px; text-align: center; cursor: pointer; font-family: inherit;
          color: var(--ink); line-height: 1.4; }
  .tile.on { border-color: var(--b); }
  /* break-word 不用 anywhere：iOS 15.4 以前不支援 anywhere（擁有者 2026-09-19 拍板）。
     沒有空白的長單位名不撐破格子，靠的是這一行加上 .tiles 的 minmax(0, 1fr)。 */
  .tile .u { display: block; font-size: 13.5px; font-weight: 600; color: var(--ink); overflow-wrap: break-word; }
  .tile .k { display: block; font-size: 12.5px; color: var(--ink3); }
  /* 該單位有任何人不可發送（三種原因都算）⇒ 紅字粗體 */
  .tile .k.bad { color: var(--bad); font-weight: 600; }
  .tile .p { display: block; font-size: 12px; color: var(--b); font-weight: 600; }

  /* 每一顆按鈕都明寫 color：不寫＝iOS 給系統藍 */
  .btn { display: inline-block; padding: 9px 16px; font-size: 14.5px; font-weight: 600; border: none;
    border-radius: 3px; cursor: pointer; font-family: inherit; background: #f0f0ee; color: var(--ink);
    transition: background .15s; }
  .btn:active { background: #e4e4e1; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-pri { background: var(--b); color: #fff; width: 100%; }
  .btn-pri:active { background: var(--b-dk); }
  .btn-sm { padding: 4px 11px; font-size: 12.5px; background: #f0f0ee; color: var(--ink); }
  /* 送出鈕用紅：它是全站唯一「按下去就收不回來」的動作，不該跟儲存長一樣 */
  .btn-send { background: var(--r); color: #fff; width: 100%; }
  .btn-send:active { background: #8d0f2b; }

  .fld { margin-bottom: 12px; }
  .fld label { display: block; font-size: 12.5px; color: var(--ink2); margin-bottom: 4px; }
  .fld input, select { width: 100%; font-size: 16px; padding: 9px 10px; border: 1px solid var(--ln);
    border-radius: 3px; font-family: inherit; color: var(--ink); background: #fff; }

  /* 鏡像上色圖層：與 textarea 疊在同一格，字體行高必須逐項相同，否則底色會錯位 */
  .tpl-wrap { position: relative; }
  .tpl-wrap textarea, .tpl-mirror {
    font-family: inherit; font-size: 13.5px; line-height: 1.7; padding: 10px;
    border: 1px solid var(--ln); border-radius: 3px; width: 100%;
    white-space: pre-wrap; overflow-wrap: break-word; letter-spacing: 0;
  }
  .tpl-mirror { position: absolute; inset: 0; overflow: hidden; color: transparent;
    background: #fff; pointer-events: none; border-color: transparent; }
  .tpl-mirror mark { background: var(--g-ln); color: transparent; border-radius: 1px; }
  /* emoji 標記在鏡像層只上底色、**不換成圖**——換成圖寬度就對不上 textarea，
     那一顆之後的每個字都錯位（2026-08-29 實測差 169 個字元）。 */
  /* 底色要看得出來才有意義：--warn-bg(#f7f2e6) 疊在白底上幾乎看不見
     （與 stats.html 對 --g-bg 記過的同一個問題），用深一階的琥珀。 */
  .tpl-mirror mark.emo-mark { background: #ecdfc4; }
  /* 預覽區：獨立的一塊，沒有對齊的包袱，emoji 在這裡才畫成圖 */
  .preview { border: 1px solid var(--ln); border-radius: 3px; padding: 10px;
             font-size: 13.5px; line-height: 1.7; white-space: pre-wrap;
             overflow-wrap: break-word; background: var(--g-bg); min-height: 3em; }
  .preview mark { background: var(--g-ln); border-radius: 1px; }
  .tpl-wrap textarea { position: relative; background: transparent; resize: vertical; display: block;
    min-height: 220px; }
  .ph-pop { position: absolute; z-index: 40; left: 0; right: 0; top: 100%; margin-top: 4px;
    background: #fff; border: 1px solid var(--ln); border-radius: 3px; padding: 6px;
    box-shadow: 0 4px 14px rgba(0,0,0,.08); display: flex; flex-wrap: wrap; gap: 4px; }
  .ph-pop button { background: var(--g-bg); border: none; padding: 5px 10px; font-size: 12.5px;
    font-family: inherit; color: var(--g); cursor: pointer; border-radius: 2px; }
  .ph-pop button:active { background: var(--g-ln); }
  .phs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; align-items: center; }
  .ph { font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--g-bg); color: var(--g); border: none; border-radius: 2px; padding: 3px 8px; cursor: pointer; }
  .ph-lead { font-size: 11.5px; color: var(--ink3); align-self: center; margin-right: 2px; }

  /* emoji palette（tpl-editor.js 產生的節點） */
  .emo-btn { border: 1px solid var(--ln); border-radius: 3px; background: #fff;
             padding: 2px; cursor: pointer; line-height: 0; }
  .emo-btn:active { background: var(--g-bg); }
  img.emo { width: 24px; height: 24px; vertical-align: middle; }
  .emo-more-btn { border: 1px solid var(--b); border-radius: 3px; background: #fff;
                  color: var(--b); font-size: 12px; font-family: inherit; padding: 3px 10px; cursor: pointer; }
  .emo-panel { flex-basis: 100%; margin-top: 8px; border-top: 1px solid var(--ln); padding-top: 8px; }
  .emo-grp { font-size: 13px; padding: 4px 6px; margin-bottom: 6px; width: auto; max-width: 100%; }
  .emo-grid { display: flex; flex-wrap: wrap; gap: 4px; max-height: 220px; overflow-y: auto; }

  /* 狀態列：這一則發過沒有。留白會讓「還沒查到」看起來像「沒發過」。 */
  .status { font-size: 13.5px; color: var(--ink2); background: var(--g-bg);
            border-radius: 3px; padding: 8px 10px; margin-bottom: 12px; white-space: pre-wrap; }
  .otp-box[hidden] { display: none; }
  .otp-box { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--ln); }

  @media (min-width: 768px) {
    body { max-width: 720px; padding: 32px 24px 60px; font-size: 17px; }
    h1 { font-size: 23px; } .num { font-size: 28px; }
    .card { padding: 24px 28px; }
  }
</style></head><body>

<!-- 🔴 **身分閘：預設遮住整頁，JS 確認身分之後才拿掉。**
     預設可見寫在 markup 裡而不是由 JS 打開，是為了 fail-closed——
     JS 掛掉、SDK 載不到、init 卡住，她看到的是「正在確認身分」而不是一個能按的送出鈕。 -->
<div id="liff-gate" style="position:fixed;inset:0;z-index:9999;background:#fff;
     display:flex;align-items:center;justify-content:center;padding:24px;text-align:center">
  <div style="max-width:32em">
    <!-- 識別：被擋住的三種狀態（SDK 沒載到／拿不到憑證／init 失敗）她會**一直看著這一頁**，
         全白配一行字讀起來像「網站壞了」。轉址那條只閃一下，但共用同一個閘。 -->
    <img src="assets/logo-full.svg" alt="日本國土開發" style="height:28px;margin-bottom:18px"
         onerror="this.style.display='none'">
    <div style="font-size:17px;font-weight:600;margin-bottom:10px">LINE訊息發訊</div>
    <div id="liff-gate-msg" style="font-size:15px;line-height:1.7">正在確認身分…</div>
    <div id="liff-gate-act" style="margin-top:16px"></div>
  </div>
</div>

<div class="brand"><img src="assets/logo-full.svg" alt="日本國土開發" onerror="this.style.display='none'"></div>
<div class="toplinks"><span id="msglog-entry"></span></div>

<h1>LINE訊息發訊</h1>
<div class="meta">選人 → 選範本 → 寄驗證碼到你的信箱 → 輸入驗證碼送出。</div>

<div class="card">
  <h2>① 收件人</h2>
  <div class="grid4" id="counts">
    <div><div class="num green" id="c-ok">–</div><div class="cap">可發送</div></div>
    <div><div class="num grey" id="c-unbound">–</div><div class="cap">未綁定</div></div>
    <div><div class="num grey" id="c-noemail">–</div><div class="cap">沒信箱</div></div>
    <div><div class="num red" id="c-ambiguous">–</div><div class="cap">資料重複</div></div>
  </div>
  <div class="selbar" style="margin-top:14px">
    <button type="button" class="btn btn-sm" id="btn-all">全選</button>
    <button type="button" class="btn btn-sm" id="btn-none">全部取消</button>
    <span class="n" id="picked-n">已選 0 人</span>
  </div>
  <div class="tiles" id="unit-tiles"></div>
  <div class="selbar" id="unit-bar" hidden>
    <button type="button" class="btn btn-sm" id="btn-unit-all">單位全選</button>
    <button type="button" class="btn btn-sm" id="btn-unit-none">單位取消</button>
    <span class="n" id="unit-picked-n">本單位已選 0 人</span>
  </div>
  <div id="audience-list"></div>
  <div class="msg" id="audience-note"></div>
</div>

<div class="card">
  <h2>② 訊息內容</h2>
  <div class="status" id="status-line">（尚未取得，無法確認）</div>
  <div class="fld">
    <label for="wf-tpl-list">範本</label>
    <select id="wf-tpl-list"></select>
  </div>
  <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
    <button type="button" class="btn btn-sm" id="btn-tpl-add">新增一則</button>
    <button type="button" class="btn btn-sm" id="btn-tpl-disable">停用這一則</button>
  </div>
  <div class="fld" id="tpl-add-box" hidden style="margin-top:8px">
    <label for="tpl-new-title">新範本的標題</label>
    <input id="tpl-new-title" type="text" maxlength="30" placeholder="例：端午節祝賀">
    <div style="margin-top:6px;display:flex;gap:8px">
      <button type="button" class="btn btn-sm btn-pri" id="btn-tpl-add-ok">建立</button>
      <button type="button" class="btn btn-sm" id="btn-tpl-add-cancel">取消</button>
    </div>
  </div>
  <!-- 停用區。**刻意一直顯示標題**（即使是空的）——只在有資料時才出現的區塊，
       等於在「沒有停用的」與「這個功能不存在」之間沒有差別，而她需要知道救得回來。 -->
  <div style="margin-top:10px">
    <div class="hint" id="tpl-disabled-head">已停用的範本</div>
    <div id="tpl-disabled-list"></div>
  </div>
  <div class="msg" id="tpl-life-note"></div>
  <div class="tpl-wrap">
    <div class="tpl-mirror" id="wf-mirror" aria-hidden="true"></div>
    <textarea id="wf-tpl" rows="12" aria-label="範本內容"></textarea>
  </div>
  <div class="phs" id="wf-ph-box"></div>
  <div class="phs" id="wf-emo-box"></div>
  <p class="hint">{ } 是佔位符，發送時會換成每個人自己的資料。打「{」會跳出可選清單。<br>
     編輯區裡的 <code>[[e:…]]</code> 是 emoji 的代號 —— 下面的預覽才是同仁看到的樣子。</p>
  <h2 style="margin-top:14px">預覽</h2>
  <div class="preview" id="wf-preview"></div>
  <div style="margin-top:10px"><button type="button" class="btn" id="btn-save" disabled>儲存範本</button></div>
  <div class="msg" id="tpl-note"></div>
</div>

<div class="card">
  <h2>③ 發送</h2>
  <p class="hint">送出前要先收一封驗證碼信。這是為了確認是本人操作 —— LINE 訊息送出後收不回來。</p>
  <div style="margin-top:10px"><button type="button" class="btn btn-pri" id="btn-otp">寄驗證碼到我的信箱</button></div>
  <div class="msg" id="otp-hint"></div>
  <div class="msg" id="otp-note"></div>

  <div class="otp-box" id="otp-box" hidden>
    <div class="fld">
      <label for="otp-input">驗證碼（六位數字）</label>
      <input id="otp-input" type="text" inputmode="numeric" autocomplete="one-time-code"
             maxlength="6" placeholder="000000">
    </div>
    <button type="button" class="btn btn-send" id="btn-send" disabled>送出 LINE 訊息</button>
  </div>
  <!-- 延遲送出的反悔窗口（2026-09-12 使用者拍板）。送出之後這一塊才出現。
       ⚠️ 倒數只是「還剩多久」的顯示，**不是它在計時**——真正在等的是伺服器那一次
          執行（`Utilities.sleep`）。所以關掉分頁不會取消，確認框裡明講這件事。 -->
  <div class="otp-box" id="cancel-box" hidden>
    <button type="button" class="btn" id="btn-cancel-send">取消這次發送</button>
    <span class="msg" id="cancel-count"></span>
  </div>
  <div class="msg" id="send-note"></div>
</div>

<!-- 順序：資料 → 模組 → inline script。四支都要在 inline script 之前，
     否則 gasCall／LINE_EMOJI／encodeSelection is not defined，而畫面只會停在載入中。 -->
<!-- LIFF SDK。**必須早於下面的 assets 與頁內 script**——startLiff() 會用到 window.liff。 -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="assets/gas-call.js"></script>
<script src="assets/welfare-client.js"></script>
<script src="assets/line-emoji.js"></script>
<script src="assets/tpl-editor.js"></script>
<script>
/* ════════════════════════════════════════════════════════════════════════
   LINE訊息發訊（分頁標題 `<title>`、主標題 `<h1>`、身分閘標題**三處同名**）。

   ⚠️ **名字的沿革，改寫不刪**（下面三個都是歷史紀錄，不是現行名稱）：
      · 2026-09-14 使用者拍板**整頁改名**成「line訊息發訊」（小寫 l），網址同日改成 `line.html`。
        2026-09-16 使用者指定**英文全大寫** ⇒ 現行是 `LINE訊息發訊`。
        🔴 改名要動的是**三處同名的地方 ＋ 後端那一份**：`jdc-line-gas` 的
        `DISPATCH_PAGES` 有一格 `title`，分流頁上的卡片讀的是**那一份**不是這裡。
        ⚠️ 還有第五處：`tests/fixtures/action-roles.json`（由 gas 的
        `ci/roles-matrix/export-json.js` 產生，**有雜湊 PIN 釘著**）。
        ⇒ **合併順序：本 repo 的 fixture 先合，`jdc-line-gas` 後合**

function pickedEmpNos() {

/**
 * @param {object} r 名單回應
 * @param {object} [keep] 員編集合。**由呼叫端在覆寫 ROWS 之前擷取**（見 pickedEmpNos）。

function renderAudience(r, keep) {
  keep = keep || {};

  var c = (r && r.counts) || { ok: 0, unbound: 0, no_email: 0, ambiguous: 0 };
  document.getElementById('c-ok').textContent = c.ok;
  document.getElementById('c-unbound').textContent = c.unbound;
  document.getElementById('c-noemail').textContent = c.no_email;
  document.getElementById('c-ambiguous').textContent = c.ambiguous;

  var byUnit = {}, order = [];
  UNIT_IDX = {};
  ROWS.forEach(function (row, i) {
    var u = row.unit || '（未填單位）';
    if (!byUnit[u]) { byUnit[u] = []; order.push(u); UNIT_IDX[u] = []; }
    byUnit[u].push({ row: row, i: i });
    UNIT_IDX[u].push(i);
  });
  // 重繪後那個單位不在了（名單換過）⇒ 回到「一個都不展開」，不要猜一個給她
  if (OPEN_UNIT && !byUnit[OPEN_UNIT]) OPEN_UNIT = '';

  // ── 單位格子（#89）：單位名、可發送 / 總人數、已選 N（後者由 renderPickedCount 填）
  var tiles = document.getElementById('unit-tiles');
  tiles.innerHTML = '';
  order.forEach(function (u) {
    var items = byUnit[u];
    var okN = items.filter(function (it) { return it.row.status === 'ok'; }).length;
    var t = document.createElement('button');
    t.type = 'button';
    t.className = 'tile';
    t.setAttribute('data-unit', u);
    var un = document.createElement('span');
    un.className = 'u'; un.textContent = u;           // textContent：單位名來自名冊
    t.appendChild(un);
    var k = document.createElement('span');
    // 只有數字（擁有者拍板：不寫「可發送」「未綁」任何字眼）。
    // 紅字條件＝有任何一個人不能發送，三種原因都算（擁有者 2026-09-19 拍板）。
    k.className = 'k' + (okN < items.length ? ' bad' : '');
    k.textContent = okN + ' / ' + items.length;
    t.appendChild(k);
    var p = document.createElement('span');
    p.className = 'p'; p.hidden = true;
    t.appendChild(p);
    tiles.appendChild(t);
  });

  var box = document.getElementById('audience-list');
  box.innerHTML = '';
  if (order.length) {
    var hint = document.createElement('div');
    hint.className = 'hint'; hint.id = 'unit-hint';
    hint.textContent = '點單位選人';
    box.appendChild(hint);
  }
  // 🔴 **所有單位的名單照舊全部 render，只把沒被點到的藏起來**（#89）。
  //    勾選因此仍然活在每一格 checkbox 上：下面「重繪保留勾選」、全選／全部取消、
  //    currentSelection() 都不必知道格子的存在。改成「只 render 點到的那一組」的話，
  //    沒展開的單位的勾選會在重繪時消失——那就是 8/20 誤發的同一個形狀。
  order.forEach(function (u) {
    var items = byUnit[u];
    var okN = items.filter(function (it) { return it.row.status === 'ok'; }).length;
    var d = document.createElement('details');
    d.className = 'grp';
    d.setAttribute('data-unit', u);
    // 看得到的那一組是展開的：她點了格子就是要選那個單位的人，再收一層等於多一道手續。
    // 看不看得到由 applyOpenUnit() 決定（hidden），不是這裡的 open。
    d.open = true;
    var s = document.createElement('summary');
    s.appendChild(document.createTextNode(u));
    var cnt = document.createElement('span');
    cnt.className = 'cnt';
    cnt.textContent = okN + ' / ' + items.length + ' 可發送';
    s.appendChild(cnt);
    d.appendChild(s);

    var body = document.createElement('div');
    body.className = 'body';
    items.forEach(function (it) {
      var ok = it.row.status === 'ok';
      var line = document.createElement('label');
      line.className = 'pr' + (ok ? '' : ' off');
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.id = 'cb-' + it.i;
      cb.disabled = !ok;
      cb.checked = ok && !!keep[it.row.empNo];      // ← 重繪保留勾選
      line.appendChild(cb);
      var txt = document.createElement('span');
      var nm = document.createElement('span');
      nm.className = 'nm'; nm.textContent = it.row.name || it.row.empNo;
      txt.appendChild(nm);
      var no = document.createElement('span');
      no.className = 'no'; no.textContent = it.row.empNo;
      txt.appendChild(no);
      if (!ok) {
        var why = document.createElement('span');
        why.className = 'why';
        why.textContent = STATUS_WHY[it.row.status] || it.row.status;
        txt.appendChild(why);
      }
      line.appendChild(txt);
      body.appendChild(line);
    });
    d.appendChild(body);
    box.appendChild(d);
  });
  applyOpenUnit();
  renderPickedCount();
}

/**
 * 依 OPEN_UNIT 決定看得到哪一組、哪一格是選中的。**只動顯示，不動勾選**。
 * 🔴 對應一律用 data-unit 比名字，**不用位置**——格子與名單是兩串節點，
 *    靠「第 k 個對第 k 個」只要其中一串少一個就靜默錯位。
 */
function applyOpenUnit() {
  var tiles = document.getElementById('unit-tiles').querySelectorAll('.tile');
  for (var a = 0; a < tiles.length; a++) {
    var on = tiles[a].getAttribute('data-unit') === OPEN_UNIT;
    tiles[a].className = 'tile' + (on ? ' on' : '');
    tiles[a].setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  var grps = document.getElementById('audience-list').querySelectorAll('details.grp');
  for (var b = 0; b < grps.length; b++) {
    grps[b].hidden = grps[b].getAttribute('data-unit') !== OPEN_UNIT;
  }
  var hint = document.getElementById('unit-hint');
  if (hint) hint.hidden = !!OPEN_UNIT;
  document.getElementById('unit-bar').hidden = !OPEN_UNIT;
}

/** 點一格：展開那個單位；再點一次選中的那格就收回（同桌位表的格子）。 */
function openUnit(u) {
  OPEN_UNIT = (OPEN_UNIT === u) ? '' : (u || '');
  applyOpenUnit();
  document.getElementById('audience-list').scrollTop = 0;   // 換單位從頭看，不停在上一組捲到的位置
  renderPickedCount();
}

/** 這個單位勾了幾個。 */
function unitPickedN(u) {
  var n = 0;

}

/**

 */
function renderPickedCount() {
  var n = 0;
  ROWS.forEach(function (row, i) {
    var cb = document.getElementById('cb-' + i);
    if (cb && cb.checked) n++;
  });
  document.getElementById('picked-n').textContent = '已選 ' + n + ' 人';

  var tiles = document.getElementById('unit-tiles').querySelectorAll('.tile');
  for (var a = 0; a < tiles.length; a++) {
    var un = unitPickedN(tiles[a].getAttribute('data-unit'));
    var p = tiles[a].querySelector('.p');
    p.textContent = un ? '已選 ' + un : '';
    p.hidden = !un;
  }
  document.getElementById('unit-picked-n').textContent =
    '本單位已選 ' + (OPEN_UNIT ? unitPickedN(OPEN_UNIT) : 0) + ' 人';
}

/** 勾選 → bitmap。**rows 的順序就是後端的 canonical order，不可重排。** */
function currentSelection() {
  var picked = ROWS.filter(function (r, i) {
    var cb = document.getElementById('cb-' + i);
    return cb && cb.checked;
  }).map(function (r) { return r.empNo; });
  return encodeSelection(ROWS, picked);          // ← assets/welfare-client.js
}

/** 全選／全不選。不可發送的是 disabled，本來就不該被拉進來。 */
function setAllChecked(on) {
  ROWS.forEach(function (row, i) {
    var cb = document.getElementById('cb-' + i);
    if (cb && !cb.disabled) cb.checked = on;
  });
  bumpUiGen();                 // ← 程式化的改動不會觸發 change 事件，要自己作廢舊碼
  renderPickedCount();
}

/**
 * 單位全選／單位取消（#89，按鈕字 2026-09-19 擁有者拍板）。只動展開中的那個單位；其他單位的勾選不碰。
 * 🔴 bumpUiGen 同 setAllChecked：程式化改勾選不會觸發 change，不自己作廢的話舊碼還算數。
 */
function setUnitChecked(on) {
  (UNIT_IDX[OPEN_UNIT] || []).forEach(function (i) {
    var cb = document.getElementById('cb-' + i);
    if (cb && !cb.disabled) cb.checked = on;
  });
  bumpUiGen();
  renderPickedCount();
}

/* ── 範本 ─────────────────────────────────────────────────────────────── */

/** 只畫下拉的 option。**不呼叫 selectTemplate**——切換的唯一入口是 wireTemplateSelector。 */
function renderTemplateSelector() {
  var sel = document.getElementById('wf-tpl-list');
  sel.innerHTML = '';
  TPL_ORDER.forEach(function (id) {
    var o = document.createElement('option');
    o.value = id;
    o.textContent = (TEMPLATES[id] && TEMPLATES[id].title) || id;
    sel.appendChild(o);
  });
}

var TPL_DISABLED = [];

/**
 * 畫「已停用的範本」清單。每一則配一顆恢復鈕。
 *
 * 🔴 **沒有這一段，「停用」只是「資料還在」**——她自己救不回來，
 *    只能找工程師或去翻試算表的版本紀錄，而那正是使用者 2026-07-16 明令要消滅的暗角。
 */
function renderDisabledList() {
  var box = document.getElementById('tpl-disabled-list');
  box.innerHTML = '';
  if (!TPL_DISABLED.length) {
    var p = document.createElement('div');
    p.className = 'hint';
    p.textContent = '（目前沒有停用的範本）';
    box.appendChild(p);
    return;
  }
  TPL_DISABLED.forEach(function (id) {
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:8px;margin-top:6px';
    var name = document.createElement('span');
    // textContent 不是 innerHTML：標題是她打的字，可能含 < 或 &
    name.textContent = (TEMPLATES[id] && TEMPLATES[id].title) || id;
    var btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'btn btn-sm';
    btn.textContent = '恢復'; btn.setAttribute('data-restore', id);
    row.appendChild(name); row.appendChild(btn);
    box.appendChild(row);
  });
}

/** 這一則範本有沒有未儲存的變更。**這是 binding 的一部分**：後端送的是已儲存的內容。 */
function isTplDirty() {
  return document.getElementById('wf-tpl').value !== SAVED_TPL_TEXT;
}

/**
 * 切換範本。**每一步都不可省**——少一步就是一個「畫面說 A、實際是 B」的洞。
 * 呼叫者只有兩個：loadTemplates() 的「選第一則」與 wireTemplateSelector() 的 change。
 */
function selectTemplate(id) {
  CURRENT_TPL = id;
  var tpl = TEMPLATES[id] || { text: '' };
  document.getElementById('wf-tpl-list').value = id;   // 程式化切換時下拉也要跟上
  document.getElementById('wf-tpl').value = tpl.text;
  SAVED_TPL_TEXT = tpl.text;        // ← 同步基準，否則剛切過去就被判成 dirty
  bumpUiGen();                      // ← 換範本＝舊碼失效（內含 disarmOtp）
  syncOtpButton(); syncSaveButton();
  LAST_STATUS = null; renderStatus();
  loadStatus(id);                   // ← 非同步；回來時會再比一次 templateId
  paintMirror('wf-tpl', 'wf-mirror', 'wf');
  paintPreview('wf-tpl', 'wf-preview', 'wf');
}

/**
 * 儲存成功之後。**三件事都要做，少一件就是一個「畫面 A、實際 B」。**
 * 🔴 少了第①行：切走再切回會從快取拿出舊文，同時把基準也設成舊文 ⇒ dirty=false
 *    ⇒ 她看到舊文、寄得到碼，而後端重讀範本送出的是已儲存的新文。
 * 🔴 一定要帶 templateId：存 A 的請求還沒回來就切到 B 的話，A 的回應會蓋掉 B 的基準。
 */
function onTemplateSaved(templateId, text) {
  if (TEMPLATES[templateId]) TEMPLATES[templateId].text = text;  // ①
  if (templateId !== CURRENT_TPL) return;                        // ②
  SAVED_TPL_TEXT = text;                                         // ③ 用**送出去的那份**
  syncOtpButton();
  syncSaveButton();
}

/**
 * 按「儲存範本」。
 * 🔴 sentTpl／sentText 在點擊當下抓下來，之後只用這兩個變數——回應回來時用
 *    CURRENT_TPL 或 .value 重讀的話，寫進快取的是「她後來改的」，
 *    而伺服器上存的是「按下去那一刻的」。
 */
function onSaveTemplate() {
  if (SAVE_IN_FLIGHT) return;                       // 同步防雙擊，早於任何非同步
  var sentTpl  = CURRENT_TPL;
  var sentText = document.getElementById('wf-tpl').value;
  var sentTitle = TEMPLATES[sentTpl] ? TEMPLATES[sentTpl].title : '';
  SAVE_IN_FLIGHT = true;
  syncSaveButton();
  setNote('tpl-note', '儲存中…');
  // ⚠️ **return 那條 Promise**。回傳值沒有任何生產程式碼在用，但少了它，
  //    接線測試只能靠「await 幾個 tick」去猜非同步跑完了沒——那是在賭運氣。
  return wfCall('saveWelfareTemplate',
          { templateId: sentTpl, title: sentTitle, text: sentText }, 45000)
    .then(function (r) {
      if (r && r.ok) { onTemplateSaved(sentTpl, sentText); setNote('tpl-note', '已儲存。', 'ok'); return; }
      // ⚠️ gasCall 永遠 resolve；傳輸失敗與伺服器拒絕的說法不同，
      //    但**兩者都不可以更新快取或基準**——不確定有沒有存進去就不能說存了。
      setNote('tpl-note', (r && r.transport)
        ? '沒有收到伺服器回應，不確定有沒有存進去。請重新整理後確認內容再繼續。'
        : ((r && r.msg) || '儲存失敗，請再試一次。'), 'err');
    })
    .then(function () { SAVE_IN_FLIGHT = false; syncSaveButton(); },
          function (e) { SAVE_IN_FLIGHT = false; syncSaveButton();
                         setNote('tpl-note', '畫面處理時發生錯誤：' + (e && e.message), 'err');
                         throw e; });
}

/* ── 三顆按鈕的狀態：各自只有一個指派點 ──────────────────────────────── */

/** 🔴 btn-save.disabled 只准由這一支指派。 */
function syncSaveButton() {
  // 送出進行中也要鎖：那時候改內容並儲存，後端重讀範本可能送出她沒在確認框看過的版本
  document.getElementById('btn-save').disabled =
    SAVE_IN_FLIGHT || SEND_IN_FLIGHT || !isTplDirty();
}

/**
 * 🔴 btn-otp.disabled 只准由這一支指派。
 *    它同時受「寄碼進行中」與「範本有未存變更」影響——兩處各寫各的必然打架
 *    （.then 裡無條件開啟會蓋掉 dirty 的停用）。
 */
function syncOtpButton() {
  var dirty = isTplDirty();
  document.getElementById('btn-otp').disabled = OTP_IN_FLIGHT || dirty;
  setNote('otp-hint', dirty ? '範本有未儲存的修改，請先儲存再寄驗證碼。' : '');
}

/**
 * 🔴 btn-send.disabled 只准由這一支指派。
 *    它同時是「OTP 有沒有效」與「送不送出中」——兩處各寫各的兩個方向都會壞：
 *    disarmOtp 停用它而 showOtpInput 只切 hidden ⇒ 拿到碼卻按不了送出；
 *    送出後無條件 disabled=false ⇒ 已經 disarm 的按鈕又亮起來。
 */
function syncSendButton() {
  document.getElementById('btn-send').disabled =
    !(OTP_STATE.armed && otpBindingStillValid() && !SEND_IN_FLIGHT);
}

/* ── 驗證碼的 binding ─────────────────────────────────────────────────── */

/** 解除輸碼狀態。任何會讓 binding 失效的事件都要（直接或經 bumpUiGen）呼叫它。 */
function disarmOtp() {
  OTP_STATE = { armed: false, gen: -1, templateId: '', audienceRev: '', selection: '',
                count: 0, quotaWarning: '', uncertain: false };
  hideOtpInput();
  syncSendButton();
}

/** 武裝。**只有這裡會把 armed 設成 true。** */
function armOtp(state) {
  OTP_STATE = state;
  showOtpInput();
  syncSendButton();
}

/**
 * 現在畫面上這一份，與寄碼當下綁定的那一份，是不是同一份。
 * 🔴 onSend 一定要再比一次——UI 事件會漏（新增的節點、程式化的改動），這一次不會漏。
 */
function otpBindingStillValid() {
  return OTP_STATE.armed
      && OTP_STATE.gen === UI_GEN                  // ← 涵蓋非同步競態與所有 UI 變動
      && OTP_STATE.templateId === CURRENT_TPL
      && OTP_STATE.audienceRev === AUDIENCE_REV
      && OTP_STATE.selection === currentSelection()
      && !isTplDirty();                            // ← 未存草稿＝畫面與已儲存的不一樣
}

/* ── 狀態（這一則發過沒有） ───────────────────────────────────────────── */

/**
 * 狀態 → 一句人看得懂的話。確認框與狀態列共用。
 *
 * 🔴 **值域必須與後端對齊。** 後端 deriveState 的 state 是四個值
 *    （sent／partial／unsent／unknown），而「紀錄有沒有記到」是**獨立的旗標**
 *    `recordingFailed`，不是 state 的第五個值——做成 state 的話它會蓋掉 partial：
 *    130 成功 7 失敗 ＋ 紀錄沒寫，畫面就不會提那 7 個人。（G1.5 高嚴重度。）
 *    getWelfareStatus 走的是 welfareStatusFrom（三態，沒有 recordingFailed），
 *    那時旗標是 undefined ⇒ 不附加。兩個來源共用這一支。
 */
function welfareStateLabel(r) {
  // 🔴 **「查不到送達結果」與「失敗」要分開講**（2026-08-29 codex G2 高嚴重度的下游）。
  //    後端把 absent 從 failed 拆出來之後，狀態列若還是只講 failedCount，
  //    就會與 send-note 那句（後端組的 r.msg）說不同的話——而她看的是畫面。
  //    ⚠️ getWelfareStatus 走 welfareStatusFrom，那支沒有 absentCount ⇒ 一律 0，
  //       所以這兩個分支對它而言行為不變。
  var ab = Number(r.absentCount || 0);
  var head = ({
    sent:    '已發送（' + (r.lastSentAt || '') + '）',
    partial: '⚠️ 上次部分成功（成功 ' + r.sentCount
           + (r.failedCount ? '、失敗 ' + r.failedCount : '')
           + (ab ? '、查不到結果 ' + ab : '') + '）'
           + '——請不要整批重發，成功的人會收到第二次',
    unsent:  '沒有發送紀錄',
    // 🔴 **讀不到就要講「為什麼讀不到」。** 後端的 readHubLog_ 五條失敗路徑
    //    各自帶了可讀的原因（HTTP 幾、回了什麼、token 是不是過期），
    //    `getWelfareStatus` 也把它放進 `why` ——**而這裡原本沒有用它**。
    //    那是「系統知道原因，只是不告訴任何人」，跟 2026-08-21 修掉的那個
    //    是同一個形狀。（2026-08-29 上線當天使用者看到「狀態不明」，
    //    而原因被丟在後端，只能靠一輪一輪打 API 猜。）
    unknown: ab
           ? ('⚠️ 有 ' + ab + ' 則查不到送達結果——訊息平台可能還在送，請不要重按')
           : ('⚠️ 狀態不明（訊息紀錄讀不到）'
              + (r.why ? '\n原因：' + r.why : ''))
  })[r.state] || '狀態不明';
  // 紀錄狀態是獨立的一軸，附在後面，不可蓋掉上面那句。
  return head + (r.recordingFailed === true
    ? '\n⚠️ 訊息紀錄沒有記到這一批——請告知工務管理組' : '');
}

/** 確認框要用的那句話。**templateId 不符就說「無法確認」，不可說「沒有發送紀錄」。** */
function lastStatusLabel() {
  if (!LAST_STATUS) return '（尚未取得，無法確認）';
  if (LAST_STATUS.templateId !== CURRENT_TPL) return '（無法確認——狀態還在載入）';
  return LAST_STATUS.stateLabel;
}

/** 把 LAST_STATUS 畫到狀態列。**沒有資料時要說「還沒取得」，不可留白。** */
function renderStatus() {
  var t = lastStatusLabel();
  if (LAST_STATUS && LAST_STATUS.stale) t += '\n（狀態更新失敗，上面顯示的是本次送出的結果）';
  document.getElementById('status-line').textContent = t;
}

/** 載入某一則的狀態。**回應抵達時若已經切換範本，就丟掉不寫。** */
function loadStatus(templateId) {
  var gen = ++STATUS_GEN;
  wfCall('getWelfareStatus', { templateId: templateId }, 30000)
    .then(function (r) {
      // 🔴 **只有最新那一份可以落地。** 同一則範本連續查兩次時，先發的那份可能後到；
      //    只比 templateId 是擋不住的（兩份的 templateId 一樣）。
      //    後果：本次 130 成功 7 失敗，被較舊的「已發送」蓋掉 ⇒ 那 7 個人沒人知道要補。
      //    （2026-08-29 codex G3 高嚴重度。）
      if (gen !== STATUS_GEN) return;
      if (templateId !== CURRENT_TPL) return;      // 已經切走了，這份是舊的
      if (!r || !r.ok) {
        // 🔴 **校正失敗不可以清掉剛拿到的權威結果。** LINE 已經回報 130 成功 7 失敗，
        //    只因為讀 hub 逾時就洗成「尚未取得」⇒ 又一次把該補發的 7 人藏起來。
        //    只有「本來就沒有同一則的結果」時才留 null。
        if (LAST_STATUS && LAST_STATUS.templateId === templateId) {
          // 🔴 **不可以寫進 send-note。** 那裡放的是送出結果，含「⚠️ 請不要整批重發」
          //    ——寫上去就把最重要的那句擠掉了，而那正是這條修正要保護的東西。
          //    （2026-08-29：我修這一條時第一版就是這樣寫的，回歸測試當場抓到。）
          LAST_STATUS.stale = true;
          renderStatus();
          return;
        }
        LAST_STATUS = null; renderStatus(); return;
      }
      // 🔴 **不可降級。** 我們剛剛才送出成功，而 hub 回「沒有發送紀錄」
      //    ⇒ 它的紀錄還沒寫完（寫入有延遲），不是真的沒發過。
      //    覆蓋下去會把「已經發過」洗成「沒有發送紀錄」——而那句話正是
      //    確認框用來防重複整批發送的那一句。
      //    （2026-08-29 e2e 抓到。計畫只警告了 recording_failed 那一半，
      //      但即使紀錄有寫，「還沒寫完」同樣會把事實洗掉。）
      //    切換範本時 LAST_STATUS 會歸零，所以真的「沒發過」仍顯示得出來。
      //    ⚠️ `unknown` 也要納入保護（2026-08-29 codex G2 之後）：那一態現在還包含
      //       「hub 可能還在背景送」，被洗成「沒有發送紀錄」的話她會直接重發。
      if (LAST_STATUS && LAST_STATUS.templateId === templateId
          && (LAST_STATUS.state === 'sent' || LAST_STATUS.state === 'partial'
              || LAST_STATUS.state === 'unknown')
          && r.state === 'unsent') return;
      LAST_STATUS = { templateId: templateId, state: r.state,
                      stateLabel: welfareStateLabel(r), lastSentAt: r.lastSentAt };
      renderStatus();
    });
}

/**
 * 🔴 **送出結果的唯一處理入口。** 它同時負責畫面文案**與更新 LAST_STATUS**。
 *    只寫畫面的話：不切範本再申請一次碼，確認框仍說「沒有發送紀錄」
 *    ——而那句話正是用來防重複整批發送的。
 *
 * ⚠️ **不可以「送完就重讀 hub」了事**：recordingFailed 的意思正是 hub 沒記到這一批，
 *    重讀會拿到上一批或 unsent，把最重要的那句警告洗掉。
 *    ⇒ 先用這次的回應寫進 LAST_STATUS；只有紀錄有記到的 sent／partial 才另外校正。
 */
function showState(r, sentTpl) {
  // 🔴 **用送出當下的那一則，不是回應抵達時的 CURRENT_TPL。**
  //    送出等待期間她可以切範本 ⇒ A 已經送出去了，結果卻被記到 B 頭上：
  //    畫面說 B 已發送，而 B 其實一則都沒送（且被「不可降級」擋著改不回來）。
  //    （2026-08-29 codex G3 高嚴重度。）
  sentTpl = sentTpl || CURRENT_TPL;
  LAST_STATUS = { templateId: sentTpl, state: r.state,
                  stateLabel: welfareStateLabel(r), lastSentAt: r.lastSentAt };
  // 這一份是最權威的（LINE 剛回的），讓所有在途的狀態查詢失效
  STATUS_GEN++;
  var cls = (r.state === 'sent' && r.recordingFailed !== true) ? 'ok' : 'err';
  if (sentTpl !== CURRENT_TPL) {
    // 已經切走了：不可以把 A 的結果畫到 B 的狀態列上，但一定要讓她看到 A 的結果。
    setNote('send-note', '【' + tplTitle(sentTpl) + '】' + (r.msg || LAST_STATUS.stateLabel)
      + '\n（你已經切到別的範本，上面的狀態列顯示的是目前這一則）', cls);
    return;
  }
  renderStatus();
  setNote('send-note', r.msg || LAST_STATUS.stateLabel, cls);
  if ((r.state === 'sent' || r.state === 'partial') && r.recordingFailed !== true) {
    loadStatus(sentTpl);
  }
}

/** 範本標題，找不到就回 id——訊息裡要講得出是哪一則。 */
function tplTitle(id) {
  return (TEMPLATES[id] && TEMPLATES[id].title) || id;
}

/* ── 寄驗證碼 ─────────────────────────────────────────────────────────── */

/**
 * 三種結果，三種處置：
 *   ok:true                   → 進輸碼狀態（resent 只影響文案）
 *   ok:false, transport:true  → **可能已經寄出** ⇒ 也要進輸碼狀態，人數標記為不確定
 *   ok:false, transport:false → 伺服器明確拒絕 ⇒ 不進輸碼狀態，顯示它的 msg
 */
function onRequestOtp() {
  if (OTP_IN_FLIGHT || isTplDirty()) return;   // 同步防雙擊＋擋未存草稿，早於任何非同步
  OTP_IN_FLIGHT = true;
  syncOtpButton();                             // ← 不直接寫 disabled
  setNote('otp-note', '寄送中…');
  // 🔴 **在送出請求之前就把這四個值抓下來。** 她可以在等回應期間改勾選；
  //    回來時重算的話，存進 OTP_STATE 的會是「她後來改的」，而碼綁的是「按下去那一刻的」。
  var sentTpl = CURRENT_TPL, sentRev = AUDIENCE_REV, sentSel = currentSelection();
  var sentGen = UI_GEN;
  return wfCall('requestWelfareOtp', {      // ← return：見 onSaveTemplate 的理由
    templateId: sentTpl, audienceRev: sentRev, selection: sentSel
  }, 45000)                                    // ⚠️ 數字，不是 { timeout: 45000 }
    .then(function (r) {
      // 🔴 回應抵達時先確認這份請求還算數。照舊武裝的話，碼綁的是舊的一份而畫面是新的。
      if (sentGen !== UI_GEN) {
        setNote('otp-note', '你在寄送期間改過勾選或範本，這組碼已不適用。'
          + '請重新按一次「寄驗證碼」。', 'err');
        return;
      }
      if (r && r.ok) {
        armOtp({ armed: true, gen: sentGen,
                 templateId: sentTpl, audienceRev: sentRev, selection: sentSel,
                 count: r.count, quotaWarning: r.quotaWarning || '', uncertain: false });
        setNote('otp-note',
          (r.resent === false
            ? '剛剛已經寄過一組，請查看信箱（60 秒內不重複寄送）。'
            : '驗證碼已寄到 ' + r.sentTo + '，10 分鐘內有效。')
          + '　收件人 ' + r.count + ' 人。'
          + (r.quotaWarning ? '\n⚠️ ' + r.quotaWarning : ''), 'ok');
        return;
      }
      if (r && r.transport) {
        // 🔴 **這裡不可以說「寄送失敗」。** 請求送出去了、回應沒回來 ⇒ 碼可能已經寄出。
        //    說失敗會讓她一直重按。binding 照樣要存——那幾個識別值在送出前就在前端手上，
        //    不確定的只有「後端算出來的人數」。
        armOtp({ armed: true, gen: sentGen,
                 templateId: sentTpl, audienceRev: sentRev, selection: sentSel,
                 count: 0, quotaWarning: '', uncertain: true });
        setNote('otp-note', '沒有收到伺服器回應。'
          + '⚠️ 驗證碼可能已經寄出，請先查看信箱；若沒收到，60 秒後再按一次。', 'err');
        return;
      }
      // 伺服器明確拒絕。🔴 **一定要 disarm**——只改提示文字的話，舊的輸碼狀態還在、
      // 送出鈕還能按，而那組舊碼綁的是舊名單 ⇒ 畫面顯示新的、實際發給舊的。
      disarmOtp();
      setNote('otp-note', (r && r.msg) || '寄送失敗，請再試一次。', 'err');
    })
    // 🔴 只清 inFlight，交給 syncOtpButton 推導——無條件開啟會蓋掉 dirty 的停用。
    .then(function () { OTP_IN_FLIGHT = false; syncOtpButton(); },
          function (e) { OTP_IN_FLIGHT = false; syncOtpButton(); throw e; });
}

/* ── 反悔窗口：倒數與取消鈕 ───────────────────────────────────────────── */

/**
 * 開窗。**只由 `onSend` 在確認框按下確定之後呼叫。**
 * 記住這一發的 nonce——取消要送同一個識別值上去，畫面上也才知道在取消哪一發。
 */
function armCancel(nonce) {
  CANCEL_NONCE = String(nonce || '');
  CANCEL_IN_FLIGHT = false;
  document.getElementById('cancel-box').hidden = false;
  syncCancelButton();
  CANCEL_LEFT = SEND_CANCEL_SEC;
  if (CANCEL_TIMER) clearInterval(CANCEL_TIMER);
  cancelTick();
  CANCEL_TIMER = setInterval(cancelTick, 1000);
}

/**
 * 倒數一格。
 * ⚠️ **刻意寫成 `function` 宣告、不是 `var tick = function`**——
 *    `tests/source-scan-tripwire.test.js` 有一條絆線在擋後者：共用的取原始碼工具
 *    列舉不到那種形式，會**靜默**取不到（2026-09-12 我就是被它擋下來的）。
 */
function cancelTick() {
  // 🔴 歸零之後**不可以**說「已經送出去了」。這裡的倒數與伺服器的等待是兩份，
  //    沒有東西逼它們相等 ⇒ 它只知道自己數完了。說死會變成一句錯的保證。
  setNote('cancel-count', CANCEL_LEFT > 0
    ? ('還有 ' + CANCEL_LEFT + ' 秒（關掉頁面不會取消）')
    : '時間到了，隨時會送出——取消可能已經來不及。');
  if (CANCEL_LEFT <= 0) { clearInterval(CANCEL_TIMER); CANCEL_TIMER = null; return; }
  CANCEL_LEFT--;
}

/** 關窗。送出那一次呼叫回來（成功或失敗）就沒得取消了。 */
function disarmCancel() {
  CANCEL_NONCE = '';
  if (CANCEL_TIMER) { clearInterval(CANCEL_TIMER); CANCEL_TIMER = null; }
  document.getElementById('cancel-box').hidden = true;
  setNote('cancel-count', '');
}

/**
 * 🔴 btn-cancel-send.disabled 只准由這一支指派（同 `syncSendButton` 的理由：
 *    兩處各寫各的方向，一定會出現「該按得動卻按不動」）。
 */
function syncCancelButton() {
  document.getElementById('btn-cancel-send').disabled = !CANCEL_NONCE || CANCEL_IN_FLIGHT;
}

/**
 * 按下取消。**這是另一次請求**——送出那一次還卡在伺服器上睡覺，
 * 它不可能自己回頭看有沒有人按了鈕。
 *
 * ⚠️ **不在這裡宣布結果。** 這一支只負責把「我要取消」寫進伺服器那一格；
 *    到底攔不攔得住由後端回答（它可能回 `too_late`）。畫面上的定論一律等
 *    **送出那一次呼叫**回來——那一則才是真正知道有沒有人收到的。
 */
function onCancelSend() {
  if (!CANCEL_NONCE || CANCEL_IN_FLIGHT) return;      // 同步防雙擊，早於任何非同步
  CANCEL_IN_FLIGHT = true;
  syncCancelButton();
  setNote('send-note', '正在取消…');
  return wfCall('sendWelfareBroadcast',
          { cancel: '1', templateId: CURRENT_TPL, nonce: newNonce() })
    .then(function (r) {
      if (r && r.transport) {
        // 🔴 取消的請求送不出去 ＝ **沒有取消成功**，不是「大概取消了吧」。
        //    窗口很短，所以要她立刻再按一次，不是叫她等。
        setNote('send-note', '⚠️ 取消沒有送達伺服器，這一發可能還會送出去。請立刻再按一次取消。', 'err');
        return;
      }
      setNote('send-note', (r && r.msg) || '取消的結果無法確認。', (r && r.ok) ? '' : 'err');
    })
    // 等價於 finally（舊 Safari 沒有 Promise.prototype.finally）。
    .then(function () { CANCEL_IN_FLIGHT = false; syncCancelButton(); },
          function (e) { CANCEL_IN_FLIGHT = false; syncCancelButton(); throw e; });
}

/* ── 送出 ─────────────────────────────────────────────────────────────── */

function onSend() {
  if (SEND_IN_FLIGHT) return;                             // 同步防雙擊，早於任何非同步

  // 🔴 **送出前再比一次 binding。** 輸碼欄開著的時候她還是可以改勾選、換範本、
  //    或改草稿不存，而那組碼綁的是舊的一份。UI 事件那道會漏，這一道不會漏。
  if (!otpBindingStillValid()) {
    disarmOtp();
    setNote('send-note', '你在取得驗證碼之後改過勾選、範本或內容（含未儲存的修改）。'
      + '為避免發錯對象或發錯內容，已停止送出——請重新按「寄驗證碼」。', 'err');
    return;
  }

  // 🔴 nonce 在點擊當下產生，早於 confirm() 與 gasCall()。寫在 gasCall 內的話，
  //    她在確認框前面猶豫時再按一次會產生第二個 nonce，防重複就白做了——而且無聲。
  var nonce = newNonce();
  // 🔴 **在這裡抓下來。** 回應抵達時 CURRENT_TPL 可能已經被她切走了，
  //    用那個記結果就是把 A 的送出寫到 B 頭上。
  var sentTpl = CURRENT_TPL;
  SEND_IN_FLIGHT = true;
  syncSendButton();                                       // ← 不直接寫 disabled
  syncSaveButton();                                       // 送出中也鎖住儲存
  // 人數用 OTP_STATE.count（後端 decode 之後的實際數），不是前端自己數的。
  // 🔴 uncertain 時**不可以報一個假數字**（那次回應沒拿到）。
  var who = OTP_STATE.uncertain
    ? '（人數無法確認——寄碼時沒有收到伺服器回應）'
    : OTP_STATE.count + ' 位同仁';
  var msg = '確定要發送給 ' + who + '嗎？\n\n'
          + '這一則最近一次的狀態：' + lastStatusLabel() + '\n'
          + (OTP_STATE.quotaWarning ? ('⚠️ ' + OTP_STATE.quotaWarning + '\n') : '')
          // 🔴 **兩句都要講，而且第二句不可以省。**
          //    等待是在**伺服器上**進行的（它沒有辦法知道你的分頁還開不開），
          //    所以關掉分頁不會取消。她若以為關掉就不送，會用錯的方式「反悔」。
          + '\n按下確定之後有 ' + SEND_CANCEL_SEC + ' 秒可以按「取消這次發送」。'
          // ⚠️ 這是 confirm() 的純文字，markdown 的星號會原樣顯示，不要用。
          + '\n⚠️ 關掉這一頁不會取消——等待是在伺服器上進行的，時間到照樣送出。'
          + '\n⚠️ LINE 訊息送出後收不回來。';
  if (!confirm(msg)) { SEND_IN_FLIGHT = false; syncSendButton(); syncSaveButton(); return; }
  // 開倒數＋取消鈕。**用這次的 nonce 記住「可以取消的是哪一發」**。
  armCancel(nonce);
  return wfCall('sendWelfareBroadcast',    // ← return：見 onSaveTemplate 的理由
          { templateId: CURRENT_TPL, otp: otpValue(), nonce: nonce },
          // ⚠️ 數字；不是預設的 45 秒。**延遲窗口把這一次呼叫拉長了**：
          //    窗口 60 秒 ＋ 一次發送實測 31–52 秒 ≈ 112 秒，原本的 120000 只剩 8 秒餘裕
          //    ⇒ 逾時會讓「其實送成功了」被顯示成 transport（狀態不明），
          //      而那一則文案會叫她不要重按、去查紀錄——**一個本來不必發生的疑案**。
          SEND_TIMEOUT_MS)
    .then(function (r) {
      disarmCancel();                      // 回來了就沒得取消了（不管成功失敗）
      if (r && r.ok) { disarmOtp(); showState(r, sentTpl); return; }   // 送出成功＝這組碼用掉了
      if (r && r.transport) {
        // 🔴 傳輸失敗 ＝ unknown，**不是失敗**。
        //    ⚠️ 這裡**也要 disarm**：碼可能已經被後端消耗掉了（used=true），
        //    留著輸碼狀態只會讓她再按一次、然後收到「已用過」。
        disarmOtp();
        showState({ ok: true, state: 'unknown', msg:
          '⚠️ 送不出去，而且不確定對方有沒有收到。請不要重按——'
          + '請先到訊息紀錄確認，或聯絡工務管理組。' }, sentTpl);
        return;
      }
      showServerReject(r);                                // 明確拒絕（OTP 錯／過期／名單變動）
    })
    // 🔴 **兩個分支都要跑，而且只清 inFlight、不直接開按鈕。**
    //    單寫 .then(fn) 的話，前一個 .then 拋例外這一個會被跳過 ⇒ 送出鈕永久卡住。
    //    但也不可以無條件 disabled=false——那會把已經 disarm 的按鈕重新點亮。
    //    這裡等價於 finally（舊 Safari 沒有 Promise.prototype.finally）。
    .then(function () { SEND_IN_FLIGHT = false; syncSendButton(); syncSaveButton(); },
          function (e) { SEND_IN_FLIGHT = false; syncSendButton(); syncSaveButton();
                         setNote('send-note', '畫面處理時發生錯誤：' + (e && e.message), 'err');
                         throw e; });          // 重新拋出，讓它進得了 console
}

/**
 * 伺服器明確拒絕時的處置。**每一種理由對輸碼狀態的影響不同**，不可一律只印訊息。
 * 後端回的 msg 已經是給人看的完整句子，直接顯示；這裡決定「要不要把她踢出輸碼狀態」。
 */
function showServerReject(r) {
  setNote('send-note', (r && r.msg) || '送出失敗，請再試一次。', 'err');
  // bad_code ＝ 打錯字，**留著讓她再試**（後端還有 5 次上限擋著）。
  if (r && r.reason === 'bad_code') return;
  // used／locked／expired／none ＝ 這組碼再也不會通過；名單／範本變動等沒有 reason 的
  // 拒絕，一律當成要重新申請。不 disarm 的話她會對著一個永遠不會成功的輸碼欄一直按。
  disarmOtp();
}

/* ── 訊息紀錄入口 ─────────────────────────────────────────────────────── */

/**
 * 🔴 **2026-09-13（訊息平台多人化「乙」，線 ML）改成走 LINE 登入，不再帶 hub 的 token。**
 *    連結只帶 `from=welfare`（＋天數）：`line-messages.html` 看到它就改打 gas 的
 *    `getWelfareMessageLog`，**只帶 idToken**——與本頁 `wfCall` 同一條路（本頁已經只走 LINE 登入）。
 *    誰看得到什麼由 gas 的守門與角色過濾決定，`from` 不是授權。
 *
 * ⚠️ **刻意不再讀 `r.msgLogToken`／`r.msgLogWhy`**（`getWelfareAudience` 仍會回，後端不動）。
 *    🔴 **2026-09-16（`jdc-tw-org/jdc-line-hub#27`）：這一段的「為何」已經整段過期，照現況重寫。**
 *       原文的理由是「讀了就會把 `?t=` 帶回網址 ⇒ 走①舊路直接打 hub」，並且明寫
 *       「仍然成立的是：`?t=` 那條路沒有被拿掉，只是網址換了名字」。**那句話現在是假的**——
 *       `?t=` 整條已經拆掉（`line-messages.html` 帶 `t` 一律出墓碑、不打任何後端）。
 *    ⇒ **不讀它的指令本身沒有變，換了一個仍然為真的理由**：那兩格現在什麼都換不到，
 *       讀它只會在網址上長出一個會被墓碑攔下來的參數，把一個能用的入口變成一句「已停用」。
 * ⚠️ 入口因此**不再依賴換發成功**：以前 `msgLogToken` 換不到就不給連結；現在連結永遠在，
 *    讀不到的原因改由 line-messages.html 那一頁講（hub 讀不到、角色不符都有一句話）。
 */
function renderMsgLogEntry(r) {
  var el = document.getElementById('msglog-entry');
  el.innerHTML = '';
  var a = document.createElement('a');
  a.href = 'line-messages.html?from=welfare&days=180';
  a.textContent = '訊息紀錄';
  el.appendChild(a);
}

/* ── 載入 ─────────────────────────────────────────────────────────────── */

/** 名單重新載入之後。audienceRev 換新＝舊碼綁的名單已經不是這一份。 */
function onAudienceLoaded(r) {
  var keep = pickedEmpNos();        // 🔴 **一定要在覆寫 ROWS 之前**，見那支的註解
  AUDIENCE_REV = r.audienceRev;
  ROWS = r.rows || [];
  renderAudience(r, keep);          // 重繪（invalidator 是委派的，不受影響）
  renderMsgLogEntry(r);             // 🔴 msgLogToken 就在**這份**回應裡
                                    //    接在 Promise 鏈尾巴會拿到 undefined
  bumpUiGen();
}

/** 載名單。**回應要用的三件事都在 onAudienceLoaded 裡做完，不往鏈上傳。** */
function loadAudience() {
  return wfCall('getWelfareAudience', {}, 45000)
    .then(function (r) {
      if (!r || !r.ok) { setNote('audience-note',
        '名單讀不到：' + ((r && r.msg) || '沒有收到伺服器回應'), 'err'); return; }
      setNote('audience-note', '');     // ← 成功要清掉上一次的錯誤，否則畫面同時說
      onAudienceLoaded(r);              //    「讀不到」又列出 123 個人
    });
}

/**
 * 載範本清單。「選第一則」放在這裡——它才知道清單長怎樣。
 * ⚠️ 後端回的欄位是 `items` 不是 `templates`（一手碼 getWelfareTemplates）。
 */
function loadTemplates() {
  return wfCall('getWelfareTemplates', {}, 30000)
    .then(function (r) {
      if (!r || !r.ok) { setNote('tpl-note',
        '範本讀不到：' + ((r && r.msg) || '沒有收到伺服器回應'), 'err'); return; }
      setNote('tpl-note', '');          // ← 同上
      TEMPLATES = {}; TPL_ORDER = [];
      // 🔴 **欄位是 `templateId` 不是 `id`。**（2026-08-29 上線當天實測抓到。）
      //    讀錯的話 key 是 `undefined` ⇒ 兩則範本寫進同一格、後面覆蓋前面
      //    ⇒ 下拉兩個選項都顯示同一個標題、value 都是字串 "undefined"
      //    ⇒ 她根本選不到端午那則。而且 **54 條 e2e 全綠**——
      //      因為 mock 當初寫的是 `id`，於是測試在測一個不存在的後端。
      //    ⚠️ 正上方那句註解查了一手碼確認外層是 `items`，**卻沒查 item 裡面的欄位名**。
      //       查了一半的驗證比沒查更危險：它讓人以為這一段已經對過了。
      // ⚠️ **後端現在會把停用的也回來**——下拉只放啟用的，停用的另外列出來給她恢復。
      //    不分開的話，她會在下拉裡選到一則發不出去的範本，而畫面看不出差別。
      TPL_DISABLED = [];
      (r.items || []).forEach(function (t) {
        TEMPLATES[t.templateId] = t;
        if (t.status === '停用') TPL_DISABLED.push(t.templateId);
        else TPL_ORDER.push(t.templateId);
      });
      renderTemplateSelector();                       // 只畫下拉；事件已委派好
      renderDisabledList();
      if (TPL_ORDER.length) selectTemplate(TPL_ORDER[0]);   // ← 一則都沒有時不可以硬選
    });
}

/* ── 範本的生命週期：新增／停用／恢復 ───────────────────────────────────
 *
 * 🔴 這三支在 2026-09-02 之前**後端有、前端沒有**——`addWelfareTemplate` 與
 *    `removeWelfareTemplate` 一個呼叫點都沒有。也就是說「新增」與「刪除」
 *    從上線起就只能找工程師改表。使用者 2026-07-16 拍板的規則正是要消滅那個暗角。
 *
 * ⚠️ 三支都以「重讀整份清單」收尾，不做局部更新——
 *    局部更新要自己維護兩份狀態（畫面與後端），而它們分歧的樣子是靜默的。
 */
function afterLifecycle(note) {
  setNote('tpl-life-note', note || '', note ? 'ok' : '');
  return loadTemplates();
}

function onAddTemplate() {
  var t = String(document.getElementById('tpl-new-title').value || '').trim();
  if (!t) { setNote('tpl-life-note', '請先給這一則一個標題。', 'err'); return Promise.resolve(); }
  // ⚠️ **要 return**：不回傳的話呼叫端等不到它——測試等不到，
  //    日後要接「做完再做下一件」也接不上，而那時的症狀是「順序偶爾錯」。
  return wfCall('addWelfareTemplate', { title: t }, 30000)
    .then(function (r) {
      if (!r || !r.ok) {
        setNote('tpl-life-note', '新增失敗：' + ((r && r.msg) || '沒有收到伺服器回應'), 'err');
        return;
      }
      document.getElementById('tpl-new-title').value = '';
      document.getElementById('tpl-add-box').hidden = true;
      return afterLifecycle('已新增「' + t + '」，內容還是空的，請編輯後儲存。');
    });
}

function onDisableTemplate() {
  var id = CURRENT_TPL;
  if (!id) return Promise.resolve();
  var title = (TEMPLATES[id] && TEMPLATES[id].title) || id;
  // 停用是**可以恢復的**，所以這裡問的重點不是「你確定嗎」，
  // 而是讓她知道它會去哪裡——不然她會以為東西不見了。
  if (!confirm('要停用「' + title + '」嗎？\n它會移到下面的「已停用的範本」，隨時可以恢復。')) return Promise.resolve();
  return wfCall('removeWelfareTemplate', { templateId: id }, 30000)
    .then(function (r) {
      if (!r || !r.ok) {
        setNote('tpl-life-note', '停用失敗：' + ((r && r.msg) || '沒有收到伺服器回應'), 'err');
        return;
      }
      return afterLifecycle('已停用「' + title + '」。要用回來的話按下面的「恢復」。');
    });
}

function onRestoreTemplate(id) {
  var title = (TEMPLATES[id] && TEMPLATES[id].title) || id;
  return wfCall('restoreWelfareTemplate', { templateId: id }, 30000)
    .then(function (r) {
      if (!r || !r.ok) {
        setNote('tpl-life-note', '恢復失敗：' + ((r && r.msg) || '沒有收到伺服器回應'), 'err');
        return;
      }
      return afterLifecycle('已恢復「' + title + '」。');
    });
}

/* ── 接線 ─────────────────────────────────────────────────────────────── */

/**
 * 🔴 **一律用事件委派綁在不會被換掉的父節點上。** 名單會被重繪
 *    （快取先畫、網路回來再畫），直接綁在 checkbox 上的 listener 會隨節點消失。
 */
function wireBindingInvalidators() {
  document.getElementById('audience-list')
    .addEventListener('change', function (e) {
      if (e.target && e.target.type === 'checkbox') { bumpUiGen(); renderPickedCount(); }
    });
  // 範本草稿：input 而不是 change（change 要失焦才觸發）
  document.getElementById('wf-tpl').addEventListener('input', function () {
    bumpUiGen();        // 讓已取得的碼失效
    syncOtpButton();    // 未存草稿 ⇒ 寄碼鈕也要跟著停用
    syncSaveButton();   // ⇒ 而儲存鈕相反：這時候才該亮起來
    paintMirror('wf-tpl', 'wf-mirror', 'wf');
    paintPreview('wf-tpl', 'wf-preview', 'wf');
    phPopup('wf-tpl', 'wf');
  });
  // 鏡像層的捲動同步。綁在頁面而不搬進模組——它綁的是特定的 DOM id，屬頁面接線。
  document.getElementById('wf-tpl').addEventListener('scroll', function () {
    document.getElementById('wf-mirror').scrollTop = document.getElementById('wf-tpl').scrollTop;
  });
}

/**
 * 🔴 **使用者切換範本的事件接線。切換範本的唯一入口是 selectTemplate(id)。**
 * ⚠️ 委派在下拉本身（它不會被重繪換掉；被換掉的是 option）。
 */
function wireTemplateSelector() {
  document.getElementById('wf-tpl-list').addEventListener('change', function (e) {
    var id = e.target && e.target.value;
    if (!id || id === CURRENT_TPL) return;
    // 🔴 送出中不准切。切走的話這一批的結果會記到另一則頭上（codex G3 高③ 的根源）。
    if (SEND_IN_FLIGHT) {
      e.target.value = CURRENT_TPL;
      setNote('send-note', '正在送出中，請等這一批跑完再切換範本。', 'err');
      return;
    }
    // 未存草稿的政策：**問一次，預設不丟**。靜靜丟掉她打的字是最糟的一種收場。
    if (isTplDirty() && !confirm('這一則範本有未儲存的修改，切換後會丟失。確定要切換嗎？')) {
      e.target.value = CURRENT_TPL;    // ← 一定要拉回去，否則下拉說 B、實際還在 A
      return;
    }
    selectTemplate(id);
  });
}

/**
 * 🔴 **三顆按鈕的 click 接線。** 沒有這一支，三顆鈕按下去什麼都不會發生。
 * ⚠️ 三顆鈕的 disabled 一律由各自的 sync*Button() 推導，**這裡只接 click**。
 */
function wireButtons() {
  document.getElementById('btn-save').addEventListener('click', onSaveTemplate);
  document.getElementById('btn-tpl-add').addEventListener('click', function () {
    document.getElementById('tpl-add-box').hidden = false;
    document.getElementById('tpl-new-title').focus();
  });
  document.getElementById('btn-tpl-add-cancel').addEventListener('click', function () {
    document.getElementById('tpl-add-box').hidden = true;
    document.getElementById('tpl-new-title').value = '';
    setNote('tpl-life-note', '');
  });
  document.getElementById('btn-tpl-add-ok').addEventListener('click', onAddTemplate);
  document.getElementById('btn-tpl-disable').addEventListener('click', onDisableTemplate);
  // 🔴 委派在**不會被重繪換掉**的父節點上——恢復鈕每次重畫都是新節點，
  //    直接綁在鈕上的 listener 會隨節點一起消失（同 wireBindingInvalidators 的理由）。
  document.getElementById('tpl-disabled-list').addEventListener('click', function (e) {
    var id = e.target && e.target.getAttribute && e.target.getAttribute('data-restore');
    if (id) onRestoreTemplate(id);
  });
  document.getElementById('btn-otp').addEventListener('click', onRequestOtp);
  document.getElementById('btn-send').addEventListener('click', onSend);
  document.getElementById('btn-cancel-send').addEventListener('click', onCancelSend);
  document.getElementById('btn-all').addEventListener('click', function () { setAllChecked(true); });
  document.getElementById('btn-none').addEventListener('click', function () { setAllChecked(false); });
  document.getElementById('btn-unit-all').addEventListener('click', function () { setUnitChecked(true); });
  document.getElementById('btn-unit-none').addEventListener('click', function () { setUnitChecked(false); });
  // 格子每次重繪都是新節點 ⇒ 委派在不會被換掉的容器上（同 tpl-disabled-list 的理由）
  document.getElementById('unit-tiles').addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('.tile') : null;
    if (t) openUnit(t.getAttribute('data-unit'));
  });
}

/**
 * 頁面啟動。**順序有意義，不可調換**；而且每一步要用的值都**不靠 Promise 鏈傳遞**
 * ——鏈上的值會被每一個 .then 換掉，接在尾巴的那支會拿到 undefined。
 */
function init() {
  // 佔位符與 emoji：三個編輯器共用 assets/tpl-editor.js，本頁不自己寫一份鏡像層。
  registerPhSet('wf', [{ k: '姓名' }, { k: '單位' }]);
  enableEmoji('wf', LINE_EMOJI, LINE_EMOJI_GROUPS);
  renderPhs('wf', 'wf-ph-box', 'wf-tpl');
  renderEmojiPalette('wf', 'wf-emo-box', 'wf-tpl');   // ← 沒有這行就沒有地方可以點

  // ① 先把不會被重繪換掉的接線做好，晚於它的任何重繪才有 invalidator 可用
  wireBindingInvalidators();
  wireTemplateSelector();
  wireButtons();
  syncSaveButton(); syncOtpButton(); syncSendButton();

  // ② 確認身分，通過才載資料。**不通過就不載**——沒有身分的畫面沒有東西該顯示。
  startLiff();
}

/* ── LIFF 身分 ─────────────────────────────────────────────────────────
 *
 * 🔴 **不判斷「在 LINE 裡還是在電腦瀏覽器」**，問的是 `isLoggedIn()`：
 *      在 LINE 裡開    → 已登入 → 直接往下
 *      在電腦瀏覽器開  → 未登入 → login() 轉址 → 回來再走一次 → 已登入
 *    ⇒ **兩條路收斂成同一條，沒有「判斷不出來」這個分支。**
 *    做法照 index.html，不另起一套。
 *
 * ⚠️ **電腦那條路會多一次 LINE 登入轉址**，那是流程改變、不是 bug，要讓承辦人知道。
 */

/** 閘上寫字。`act` 是選填的一顆鈕（HTML 字串，只由本檔給，不吃外部輸入）。 */
function liffGate(text, actHtml) {
  var g = document.getElementById('liff-gate');
  if (!g) return;
  g.hidden = false; g.style.display = 'flex';
  document.getElementById('liff-gate-msg').textContent = text;
  document.getElementById('liff-gate-act').innerHTML = actHtml || '';
}

/** 擋住並具名。**不挑預設、不放行**——放行的失敗長相是「該擋的沒擋」，看不見。 */
function liffBlock(why) {
  liffGate(why, '<button type="button" class="btn btn-sm" '
    + 'onclick="location.reload()">重新整理</button>');
}

function liffOpen() {
  var g = document.getElementById('liff-gate');
  if (g) { g.hidden = true; g.style.display = 'none'; }
}

/**
 * 取一份**當下的** LINE ID token。**每次都重新取，絕不存起來。**
 *
 * 🔴 **為何不快取**：ID token 只有效一小時，而這一頁的流程有寄驗證碼、
 *    有 45 秒的送出呼叫，開著超過一小時很正常。
 *    存起來的失敗長相是：她按送出 → 驗簽失敗 → 畫面說「請重新登入」，
 *    **而她根本沒登出過** ⇒ 失敗偽裝成使用者的錯。
 *
 * 🔴 **2026-09-13 更正：上面那段承諾的防護並不存在，而它讀起來像已經做到了。**
 *    `liff.getIDToken()` **本身就是 SDK 的快取讀取，而 SDK 從不更新它**
 *    （2.31.0 實測：`getIDToken` ＝純 storage 讀取、零到期檢查；登入時 id_token
 *    存下去**一個到期時間都沒設**；整支檔 `refresh_token` 出現 0 次）。
 *    ⇒ 本函式「每次都重新取」，取到的仍是**同一顆**；它過期之後，
 *      「她按送出 → 驗簽失敗 → 畫面說請重新登入、而她根本沒登出過」**照樣會發生**。
 *    ⚠️ 這不代表這支函式該改掉：不在這裡取只會更糟（開頁時取會錯過「登入完才拿得到」）。
 *       要修的是**過期之後怎麼辦**，那在 `assets/liff-relogin.js`
 *       ——⚠️ **本頁還沒有掛那一支**（它只掛在 board.html／hr-stats.html）。
 *       🔴 2026-09-13 起本頁只走 LINE 登入（`wfCall` 不再帶 `?t=`）⇒ 每一個請求都走
 *       後端 `gateActionByLine`，憑證過期時收到的就是 `line_bad_token`。
 *       改之前（兩個都帶、走舊守門）過期時擋下它的是第二道，reason 是 `verify_` 開頭的那一類。
 *       **兩者都擋、都有一句話，但都不會自動重新登入**——那一格仍是死巷。
 *       要接 `liff-relogin.js` 是另一件事：它會整頁導走，送出流程中途導走時勾選怎麼辦要先想清楚。
 *
 * 🔴 **2026-09-13 更正②：「還沒有任何呼叫帶著它送出去」也是假的。**
 *    原文寫的是「這一輪（Task 1 前半）只把它準備好」——那句在 Task 1 前半是真的，
 *    但下面的 `wfCall` 早就在帶了，而**本頁每一支 action 都走 `wfCall`**
 *    ⇒ 這一顆送得出去的次數，等於這一頁打出去的請求數。
 *    後端怎麼消費它、砍掉會怎樣，寫在 `wfCall` 的檔頭，不在這裡重述一遍。
 */
function freshIdToken() {
  if (!(window.liff && typeof liff.getIDToken === 'function')) return '';
  var t = liff.getIDToken();
  return t ? String(t) : '';
}

/**
 * 本頁的呼叫層。**每一支 action 都走這裡，憑證只掛在這一個地方。**
 *
 * 🔴 **為何不讓九個呼叫點各自帶**：那是「同一個判斷散在多處」——
 *    漏掉其中一支的症狀是**那一支永遠驗不過**，而其他八支都好好的
 *    ⇒ 看起來像那支 action 壞了，不像漏帶憑證。
 *
 * 🔴 **ID token 在這裡才取，不是頁面載入時取一次存起來。**
 *    它只有效一小時，而這一頁的流程有寄驗證碼、有 45 秒的送出呼叫。
 *
 * 🔴 **只帶 idToken，不帶網址上的 `?t=`（2026-09-13 改成只走 LINE 登入）。**
 *
 *    後端分流那一行（量法可原樣重跑，刻意不抄行號——行號會腐爛）：
 *      cd jdc-line-gas && /usr/bin/grep -n 'var _hasTok' line-platform/Code.js
 *    條件是「**token 非空就走舊守門 `gateAction`**；沒有 token 且有 idToken 才走
 *    `gateActionByLine`」。本頁在這之前兩個都帶，而正式連結都有 `?t=`
 *    ⇒ **正式環境永遠走舊守門**，LINE 那條路一次都沒有被這一頁走過。
 *    ⇒ 這裡不送 `token`，**連呼叫端自己塞進 params 的 `token`／`t` 也拿掉**
 *      ——留一個能把請求改道回舊守門的縫，等於沒改。
 *
 *    **後端今天誰在讀 idToken**（`/usr/bin/grep -n 'p\.idToken' line-platform/Code.js`）：
 *      ① 第一道 `gateActionByLine(action, p.idToken, …)`——本頁身分的**唯一來源**。
 *      ② 第二道 `messagingStrictGate_(action, _gate.identity, p.idToken)`——九支全部要過；
 *         走 LINE 那條路時它不再比兩張表，只驗這顆是不是我們的 channel 簽的。
 *    ⇒ **砍掉 idToken＝一個請求都送不出去**（見下一格），不是「只剩一道守門」。
 *
 * 🔴 **拿不到 idToken 就不送**，回一個「伺服器拒絕」形狀的結果（`transport:false`）。
 *    送出去的話：沒有 token、idToken 是空字串 ⇒ 後端分流落到舊守門、拿空字串驗 ⇒ 擋下。
 *    結果一樣是擋，但**多一個打到後端的請求，而且她看到的是一句跟 LINE 無關的話**。
 *    `transport:false` 是刻意的：這一次**確定沒有送出去**，呼叫端照「伺服器說不行」處置
 *    （可以重按、不會進「不確定有沒有寄出」的狀態）。
 *    ⚠️ 開頁時 `startLiff` 已經擋過一次；這一格接的是「開頁時有、之後沒了」。
 *
 * ⬛ **突變實測（2026-09-13）**：把本支改回「`token: TOKEN` ＋ idToken 兩個都帶」，
 *    `tests/welfare-page-wiring.test.js` 的「wfCall 只帶當下取的 idToken…」與
 *    `tests/e2e/welfare.spec.js` 的「網址帶著舊連結的 ?t=…」都會紅。
 *    ⚠️ **紅了不是叫你去改測試**：紅的意思是這一頁又回到舊守門了。
 */
function wfCall(action, params, timeoutMs) {
  var idToken = freshIdToken();
  if (!idToken) {
    return Promise.resolve({ ok: false, transport: false, reason: 'no_line_credential',
      msg: '拿不到 LINE 登入憑證，所以這一次什麼都沒有送出。'
        + '請重新整理這一頁；一直這樣的話請找資訊人員。' });
  }
  var p = {};
  Object.keys(params || {}).forEach(function (k) { p[k] = params[k]; });
  delete p.token;
  delete p.t;
  p.idToken = idToken;
  return gasCall(GAS_URL, action, p, timeoutMs);
}

function startLiff() {
  if (!(window.liff && typeof liff.init === 'function')) {
    liffBlock('LINE 的元件沒有載入成功，沒辦法確認你的身分。'
      + '請確認網路正常後重新整理；一直這樣的話請找資訊人員。');
    return;
  }
  return liff.init({ liffId: LIFF_ID })
    .then(function () {
      if (!liff.isLoggedIn()) {
        // 在電腦瀏覽器開會走到這裡：轉去 LINE 登入，回來時已登入，再走一次上面。
        liffGate('正在前往 LINE 登入，登入後會自動回到這一頁…');
        liff.login({ redirectUri: location.href });   // 回到原網址（舊連結的 ?t= 會原樣留著，本頁不讀它）
        return;
      }
      // 能力檢查：**取一次就丟掉，不留下來用**。目的是讓「拿不到憑證」在她開頁的
      // 當下就現形，而不是等她選完 137 個人、按下送出才失敗。
      if (!freshIdToken()) {
        liffBlock('已經登入 LINE，但拿不到這一頁需要的憑證。'
          + '這是 LINE 後台的設定問題，重新整理不會好，請找資訊人員。');
        return;
      }
      liffOpen();
      return loadAudience().then(loadTemplates);
    })
    .catch(function (err) {
      // **不靜默**。訊息帶出原因，否則「畫面一直是載入中」查不出是哪一段。
      liffBlock('確認身分時失敗：' + ((err && err.message) ? err.message : String(err)));
    });
}

init();
</script>
<script src="assets/back-to-me.js" defer></script>
