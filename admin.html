<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- 🔴 這一頁可能被帶著 `?t=` 打開（舊書籤）。`no-referrer` 讓那串東西不會跟著
     Referer 跑到 `me.html` 去。剝網址那一段（見下面）是主防線，這一行是保險。 -->
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="assets/app.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>管理入口（已改到 me.html）</title>
<!--
  🪦 ═══ 管理入口退場（`jdc-tw/jdc-line-gas#99`，2026-09-18 擁有者拍板）═══════════

  **這一頁原本是什麼**：三張卡片（人事異動看板／活動紀錄看板／人事資訊看板）
  ＋一張 LINE 訊息紀錄入口，把網址上的 `?t=` 接到每一張卡片的 href 上。

  🔴 **為何退場，而不是「補一套 LINE 登入」**（兩個量出來的事實，不是偏好）：

    ① **它結構上沒有 LINE 登入。** 全檔 `liff.init` 出現 0 次、`getIDToken` 0 次。
       `BOARD_TOKENS` 縮成一把 `screen` 專用鑰匙之後，這一頁**整頁死透**
       ——不是少一塊功能，是三張卡片全部指向會被拒絕的網址。
    ② **它的角色已經被 `me.html` 取代。** 那是純 LINE 登入的分流頁，
       清單由後端 `DISPATCH_PAGES` 現算（`listMyPages`）⇒ 誰看得到哪幾頁由授權名單決定，
       不必有人手維護一張卡片表。
       ⚠️ 而這一頁**不在 `DISPATCH_PAGES` 上，也沒有任何測試在守它**——
          它的三張卡片是手寫的，新增一頁不會出現在這裡，而且沒有東西會紅。

  🔴 **為何留下檔案而不是刪掉**：舊書籤散在瀏覽器、LINE 聊天室與舊信件裡，
     **那些量不到、也收不回來**。刪檔的話那些書籤拿到 GitHub Pages 的 404
     （一頁英文、沒有任何指路）。留一個著陸點，他至少知道要去哪。

  🔴 **三條鑄造出去的 `?t=` 連結一起停產**（`board.html` / `stats.html` / `hr-stats.html`）。
     鑄造是這一頁最後一個會擴散舊路的動作：留著它等於每點一次就再散播一條舊連結。
     ⬛ 自證不要用 `git grep -c`（它數的是行，而這段註解自己就提到了 `?t=`）
        ——釘在 `tests/admin-retired.test.js` 的「本頁不再鑄造任何帶 token 的網址」那一條。

  ⚠️ **`stats.html` 與 `attend.html` 這一輪維持雙軌**（副總走 `VIEW_TOKENS`，
     而 `view` 在 `NOT_ASSIGNABLE_ROLES` 裡、結構上沒有 LINE 路）。
     那與本頁退場不衝突：本頁鑄造的是 **`?t=`（BOARD）**，不是副總那把。
     副總從來不走這一頁。

  🔘 **留給擁有者的**：`getMsgLogToken` 換來的那顆 token 本頁原本會存進加密快取。
     本頁不再打任何後端 ⇒ 那一格自然停止產生。既有裝置上的殘留由 TTL（7 天）自行過期。
  ══════════════════════════════════════════════════════════════════════════════
-->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang TC','Noto Sans TC',sans-serif;background:#f5f6f8;color:#333;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .wrap{width:100%;max-width:420px}
  h1{font-size:20px;margin-bottom:4px}
  .sub{font-size:13px;color:#888;margin-bottom:20px;line-height:1.7}
  a.card{display:block;background:#fff;border:1px solid #e3e5e8;border-radius:14px;padding:18px 20px;margin-bottom:12px;text-decoration:none;color:#333;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  a.card:active{background:#f0f1f3}
  .t{font-size:16px;font-weight:700}
  .d{font-size:13px;color:#888;margin-top:4px}
  .note{background:#fff8e1;border:1px solid #ecd9a0;border-radius:14px;padding:16px 20px;margin-bottom:16px;color:#6b5410;font-size:14px;line-height:1.7}
  /* 版本標記：用來分辨「載到新版」與「瀏覽器拿到快取的舊版」 */
  .ver{margin-top:14px;text-align:center;font-size:11px;color:#c0c4c8;letter-spacing:.04em}
</style>
</head>
<body>
<div class="wrap">
  <h1>管理入口已經搬家</h1>
  <div class="note" id="moved" role="status">
    這個入口改用 LINE 登入了，新的入口是「我的頁面」。請把書籤換成下面那一條；
    舊網址上的 token 已經不需要，也不再有作用。
  </div>
  <a class="card" id="go-me" href="me.html">
    <div class="t">➜ 我的頁面</div>
    <div class="d">用 LINE 登入，自動列出你有權限的看板</div>
  </a>
  <div class="sub">
    找不到你要的看板，代表你的帳號還沒有那一頁的權限，請找資訊人員。
  </div>
  <!-- 版本標記由 JS 填 document.lastModified —— 手打的固定字串沒有用：
       2026-08-20 寫死過一次 v2026-08-20a，之後連改三版都忘了動它。
       document.lastModified 反映的是**這一份實際載到的檔案**的時間，不必維護。 -->
  <div class="ver" id="ver"></div>
</div>
<script>
// 版本標記放最前面：後面任何一段出錯，這行都已經跑完，
// 才問得出「你載到的到底是哪一份檔案」——那是快取問題與程式問題的分水嶺。
try{ document.getElementById('ver').textContent='版本 '+document.lastModified; }catch(e){}

/**
 * 把 `t`／`mt` 從網址上剝掉。**這一頁不讀它們、也不轉傳它們。**
 *
 * 🔴 為何要剝：舊書籤一打開，那串東西就停在網址列上，而這一頁旁邊就是一個
 *    連到別頁的連結 ⇒ 不剝的話它會跟著 Referer 走（`<meta name="referrer">`
 *    是保險，不是主防線——它在很舊的瀏覽器上不生效）。
 * ⚠️ 逐個參數重組，**不要用字串挖洞**：`?a=1&t=X&b=2` 挖掉中間那一段會留下 `&&`，
 *    而那種網址在多數瀏覽器上不會報錯、只會安靜地多一個空參數。
 * ⚠️ 用 `history.replaceState` 就地改、**不 reload**（reload 會多一趟、也會閃）。
 */
(function(){
  try{
    var kept=location.search.replace(/^\?/,'').split('&').filter(function(kv){
      if(!kv)return false;
      var k=kv.split('=')[0];
      return k!=='t'&&k!=='mt';
    }).join('&');
    if(kept!==location.search.replace(/^\?/,'')){
      history.replaceState(null,'',location.pathname+(kept?'?'+kept:'')+location.hash);
    }
  }catch(e){}
})();

// iOS「加到主畫面」standalone 模式：<a> 導頁會彈出帶網址列的內嵌 Safari，
// 改用 JS 導頁就留在 App 視窗內（桌機瀏覽器行為不變）。
document.querySelectorAll('a.card').forEach(function(a){
  a.addEventListener('click',function(e){e.preventDefault();location.href=this.href;});
});
</script>
</body>
</html>
