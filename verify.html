<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>身分驗證 — 日本國土開發 LINE 平台</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
  <link rel="stylesheet" href="assets/ui.css">
  <style>
    /* 🔴 色票、body、.card、.btn 來自 `assets/ui.css`。這裡只放這一頁自己的。 */

    /* 這一頁只有一張卡，logo 是主視覺 ⇒ 比共用的 150px 放大。 */
    .brand { margin: 0 0 18px; }
    .brand img { max-width: 240px; }
    /* 整頁置中：這一頁沒有清單，只有一句結果。 */
    body { padding: 40px 20px; text-align: center; }
    /* 🔴 狀態靠**卡片上緣那道色條**，不靠 emoji（設計語彙第 ③ 條：去除全部 emoji，
       不用圖案代替字）。原本這裡是一顆 48px 的表情符號（沙漏／打勾／警告三角）。
       ⚠️ 換法不是「刪掉就好」——這一頁是長輩單獨開的驗證頁，那個圖是**狀態的主要載體**。
          色條的資訊量相同（綠＝成功、紅＝失敗、灰＝進行中）、看得更遠，
          而且它不依賴任何字型有沒有那顆 emoji（Android 舊機實際會缺字變成方框）。 */
    .card { padding: 32px 24px; border-top: 4px solid var(--ln); }
    .card.ok  { border-top-color: var(--g); }
    .card.err { border-top-color: var(--bad); }
    p { color: var(--ink2); }
    .ok h1 { color: var(--g); }
    .err h1 { color: var(--bad); }
    /* 🔴 長者友善：放大預設字級（2026-06-26）。**這一條不可以被「統一字級」洗掉**
       ——這一頁是新人與長輩會單獨開的驗證頁，不是每天在用的看板。 */
    body { font-size: 17px; }
    h1 { font-size: 22px; margin-bottom: 12px; }
    .btn { font-size: 17px; padding: 13px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="brand"><img src="assets/logo-full.svg" alt="日商日本國土開發股份有限公司台灣分公司"></div>
  <div class="card" id="box">
    <h1>驗證中…</h1>
    <p>正在確認您的身分，請稍候。</p>
  </div>

  <script>
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbxaDoA_7aOW325p8165VegSqdRL8gRhfTEMfjosdh1A0T4rmzj4Pl7F3k5PToe2po-xtg/exec';
    var LIFF_LINK = 'https://liff.line.me/2010451233-a781rqsm';

    // fetch + credentials:'omit'＝不帶瀏覽器的 Google 登入狀態。
    // script 標籤 JSONP 會帶帳號 session，登入狀態半殘的電腦會被 Google 拒絕（回 Drive 錯誤頁），
    // 2026-07-24 於失敗現場以 netcheck 探針實證：JSONP 敗、fetch 匿名過。
    function jsonp(action, params, timeoutMs) {
      var qs = Object.keys(params || {}).map(function (k) {
        return encodeURIComponent(k) + '=' + encodeURIComponent(params[k] == null ? '' : params[k]);
      }).join('&');
      var url = GAS_URL + '?action=' + encodeURIComponent(action) + (qs ? ('&' + qs) : '') + '&callback=cb';
      // 逾時不靠 AbortController：iOS 12.1 以前沒有它，`new AbortController()` 會直接 ReferenceError，
      // 讓整段初始化同步當掉 → 畫面永遠停著且不顯示任何錯誤（2026-07-31 查 attend.html 時發現，全站同型）。
      // 本頁是綁定驗證的最後一哩（同仁從信件點進來），掛掉等於他驗不了但看不出原因。
      // 改用 Promise.race 計時：舊瀏覽器一樣有逾時，代價只是底層請求不會被真的取消。
      var timer, timeout = new Promise(function (_, rej) {
        timer = setTimeout(function () { var e = new Error('逾時'); e.name = 'AbortError'; rej(e); }, timeoutMs || 30000);
      });
      return Promise.race([timeout, fetch(url, { credentials: 'omit', redirect: 'follow' })
        .then(function (r) { return r.text(); })
        .then(function (txt) {
          var a = txt.indexOf('('), b = txt.lastIndexOf(')');
          if (a === -1 || b === -1) throw new Error('回應格式不符');
          return JSON.parse(txt.slice(a + 1, b));
        })])
        .then(function (v) { clearTimeout(timer); return v; })
        .catch(function (err) {
          clearTimeout(timer);
          if (err && err.name === 'AbortError') throw new Error('逾時');
          if (err && err.message === '回應格式不符') throw err;
          throw new Error('網路錯誤');
        });
    }

    function render(ok, title, msg) {
      var box = document.getElementById('box');
      box.className = 'card ' + (ok ? 'ok' : 'err');
      // 狀態由 box 的 `ok`／`err` class 決定（卡片上緣的色條＋標題顏色），不放 emoji。
      var html = '<h1>' + title + '</h1><p>' + msg + '</p>';
      if (ok) {
        // 用「按鈕(使用者點擊)」回 LINE：點擊才會觸發 iOS 的 LINE universal link、開回 LINE app。
        // 不用 JS 自動跳轉——那只會在 Safari 內開 LIFF、反而卡住。
        html += '<a class="btn btn-pri" href="' + LIFF_LINK + '">回 LINE 填寫出席調查</a>';
        html += '<p style="font-size:13px;color:var(--ink3);margin-top:10px">點上方按鈕回 LINE 填寫；或回到 LINE 點剛收到的通知。</p>';
      }
      box.innerHTML = html;
    }

    function getToken() {
      var m = location.search.match(/[?&]t=([^&]+)/);
      return m ? decodeURIComponent(m[1]) : '';
    }

    var t = getToken();
    if (!t) {
      render(false, '驗證失敗', '連結不完整，請重新從 LINE 取得驗證連結。');
    } else {
      jsonp('verify', { t: t }).then(function (res) {
        if (res && res.ok) render(true, '員工身分驗證成功！', (res && res.msg) || '您的 LINE 帳號已完成員工身分驗證。');
        else render(false, '驗證失敗', (res && res.msg) || '連結無效或已過期，請重新從 LINE 取得驗證連結。');
      }).catch(function (err) {
        render(false, '驗證失敗', '連線發生問題（' + (err && err.message ? err.message : err) + '），請稍後再試。');
      });
    }
  </script>
</body>
</html>
