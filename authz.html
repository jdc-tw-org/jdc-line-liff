<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>授權名單維護</title>
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg" />
<link rel="stylesheet" href="assets/ui.css">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<!-- 要早於 gas-call.js：底下 `load()` 的 `.then(reloginOnDeadCredential)` 在解析出口用它。 -->
<script src="assets/liff-relogin.js"></script>
<script src="assets/gas-call.js"></script>
<style>
  /* 色票、body、.card、.btn、.tag、.msg 全部來自 `assets/ui.css`。
     這裡只放**這一頁自己的**東西——不要把共用的再抄一份回來。 */

  h1.state { font-size: 14px; font-weight: 400; color: var(--ink2); }
  h1.err { color: var(--bad); }

  /* ══ 一列＝一行，點開才編輯（`#117` 的 Ａ）═══════════════════════════
     舊版一列渲染成七個 `.fld` 各佔一行 ⇒ **一列＝一大塊**，5 列就很長、50 列會爆炸。
     ⚠️ 收合是**純 CSS 的 class 切換，不重畫**。重畫會把使用者正在打的字與游標位置
        一起換掉（`feedback_swr_repaint_eats_user_input`：這一頁全是輸入欄位）。 */
  .row { border: 1px solid var(--ln); border-radius: 3px; margin-bottom: 6px; background: #fff; overflow: hidden; }
  .row.dis { background: #f7f7f5; }
  .row.hid { display: none; }
  /* 剛加進來的那一列。下一次重畫就沒了（`render()` 會整份重建），**這是刻意的**：
     它只是「你剛剛加的是這一列」的指路，不是一個要維護的狀態。 */
  .row.new { border-color: var(--g); box-shadow: inset 3px 0 0 var(--g); }

  /* 摺起來的那一行。`<button>` ⇒ 鍵盤可聚焦、Enter 可啟動，全是原生行為。 */
  .sum {
    display: flex; align-items: center; gap: 8px; width: 100%;
    font: inherit; text-align: left; padding: 9px 10px; cursor: pointer;
    background: none; border: 0; color: var(--ink); min-height: 40px;
  }
  .sum:hover { background: #fafaf9; }
  .sum:focus-visible { outline: 2px solid var(--b); outline-offset: -2px; }
  .caret { flex: none; width: 12px; color: var(--ink3); font-size: 11px; transition: transform .12s; }
  .row.open .caret { transform: rotate(90deg); }
  .sum .who { font-size: 14.5px; font-weight: 600; white-space: nowrap;
              overflow: hidden; text-overflow: ellipsis; max-width: 7em; flex: none; }
  .sum .code { font-size: 11px; color: var(--ink3); flex: none; }
  .sum .sp { flex: 1 1 auto; min-width: 4px; }
  .sum .pg { font-size: 11.5px; color: var(--ink3); flex: none; white-space: nowrap; }
  .row.dis .sum .who { color: var(--ink2); text-decoration: line-through; }

  /* 展開之後才是舊版那幾個欄位。 */
  .det { padding: 2px 10px 12px; border-top: 1px solid var(--ln); }
  .row:not(.open) .det { display: none; }

  .fld { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .fld label { font-size: 12.5px; color: var(--ink2); flex: none; width: 4.5em; }
  .fld select, .fld input {
    flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 6px 8px;
    border: 1px solid var(--ln); border-radius: 3px; background: #fff; color: var(--ink);
  }
  .fld input[readonly] { background: #f4f4f2; color: var(--ink2); }

  /* ══ Ｄ 停用日：平常是一顆鈕，按了才跳出選日期 ═══════════════════════
     ⚠️ 鈕面上**看得出已經設了哪一天**——不然「已設 2026-01-31」與「沒設」
        在畫面上長得一樣，而那兩件事完全不同。 */
  .dbtn {
    flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 6px 8px; text-align: left;
    border: 1px dashed var(--ln); border-radius: 3px; background: #fff; color: var(--ink3); cursor: pointer;
  }
  .dbtn.has { border-style: solid; color: var(--ink); }
  .dbtn:focus-visible { outline: 2px solid var(--b); outline-offset: 1px; }
  .dpop { margin: 6px 0 0 calc(4.5em + 8px); padding: 10px; background: #fafaf9;
          border: 1px solid var(--ln); border-radius: 3px; }
  .dpop .lbl { font-size: 11.5px; color: var(--ink2); margin-bottom: 5px; }
  .dpop input { width: 100%; box-sizing: border-box; font: inherit; font-size: 14px;
                padding: 6px 8px; border: 1px solid var(--ln); border-radius: 3px; background: #fff; }
  .dpop .rowbtn { display: flex; gap: 8px; margin-top: 8px; }

  /* ══ Ｂ 角色 ↔ 頁面 ═══════════════════════════════════════════════════
     🔴 這是**呈現**，不是判斷。資料整份來自後端那一發的 `rolePages`。 */
  details.ref { border: 1px solid var(--ln); border-radius: 3px; background: #fff; margin-bottom: 12px; }
  /* ⚠️ `display:block` 是拿掉預設三角的那一格——現行 Chrome 走 `::marker`，
     `list-style:none` 與 `::-webkit-details-marker` **都擋不掉它**
     （實測截圖上仍有一個小點）。三者都留著是為了涵蓋舊版 Safari。 */
  details.ref > summary { display: block; padding: 10px 12px; font-size: 13.5px; font-weight: 600;
                          cursor: pointer; color: var(--ink); list-style: none; }
  details.ref > summary::-webkit-details-marker { display: none; }
  details.ref > summary::marker { content: ''; }
  details.ref > summary:focus-visible { outline: 2px solid var(--b); outline-offset: -2px; }
  details.ref > summary::before { content: '▸ '; color: var(--ink3); font-size: 11px; }
  details.ref[open] > summary::before { content: '▾ '; }
  .refbody { padding: 0 12px 12px; }
  .refrow { display: flex; gap: 10px; padding: 7px 0; border-top: 1px solid var(--ln); font-size: 13px; }
  .refrow .rn { flex: none; width: 6.5em; font-weight: 600; color: var(--ink); }
  .refrow .rc { font-size: 11px; color: var(--ink3); font-weight: 400; display: block; }
  .refrow .rp { flex: 1; color: var(--ink2); line-height: 1.7; }
  .refnote { font-size: 11.5px; color: var(--ink3); margin-top: 10px; line-height: 1.7; }

  /* 展開後那一列自己的「這個角色看得到什麼」／「這個人合計看得到什麼」。 */
  .seen { font-size: 11.5px; color: var(--ink2); margin-top: 9px; padding: 7px 9px;
          background: var(--g-bg); border-radius: 3px; line-height: 1.7; }
  .seen b { color: var(--g); font-weight: 600; }

  /* ══ Ａ 的另一半：篩選與搜尋。**在 #list 之外**，所以重畫清單不會動到它 ══ */
  #bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
  #bar input, #bar select {
    font: inherit; font-size: 13.5px; padding: 6px 8px; border: 1px solid var(--ln);
    border-radius: 3px; background: #fff; color: var(--ink); min-width: 0;
  }
  #q { flex: 1 1 8em; }
  /* ⚠️ `padding-left` 是必要的，不是裝飾：篩選列少一顆控制項之後三顆剛好排滿一行，
     這一格會直接貼到右邊那顆下拉上（實測截圖上擠在一起）。 */
  #count { font-size: 12px; color: var(--ink3); flex: none; margin-left: auto; padding-left: 8px; }
  #count.on { color: var(--warn); font-weight: 600; }

  /* dry-run 的結果面板。**它是這一頁存在的理由**，所以它不是一行小字。 */
  #panel { padding: 14px 16px; border-radius: 3px; font-size: 14px; margin: 14px 0; }
  #panel.pass { background: var(--g-bg); color: var(--g); }
  #panel.fail { background: var(--bad-bg); color: var(--bad); }
  #panel.idle { background: var(--warn-bg); color: var(--warn); }
  #panel .gate { font-weight: 600; }
  #panel ul { margin: 8px 0 0; padding-left: 1.2em; }
  #panel li { margin-bottom: 4px; }
  .foot { font-size: 12.5px; color: var(--ink3); margin-top: 22px; line-height: 1.8; }
  .btn[disabled] { opacity: .45; }

  /* 🔴 `[hidden]` 必須贏過作者 CSS 的 display。`.btnrow { display: flex }` 的特異性
     高過 `[hidden]` 的預設 `display:none` ⇒ 設 `el.hidden = true` 會**完全沒有作用**，
     而斷言 `hidden === true` 的測試照樣綠、使用者照樣看得見（me.html 記過這一顆）。 */
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="brand"><img src="assets/logo-full.svg" alt="日商日本國土開發股份有限公司台灣分公司"></div>
<h1 id="who" class="state">確認身分中…</h1>
<div class="meta" id="meta"></div>

<!-- Ｂ：角色 ↔ 頁面。整份由後端 `getAuthzList` 的 `rolePages` 填，這裡一格都不寫死。
     預設收起來——它是**查閱用**的對照表，不是每次進來都要看的東西。 -->
<details class="ref" id="refcard" hidden>
  <summary id="refsum">角色看得到哪些頁</summary>
  <div class="refbody" id="refbody"></div>
</details>

<!-- Ａ 的另一半：搜尋與篩選。刻意放在 `#list` **外面**——重畫清單時不會動到它，
     使用者打到一半的搜尋字不會被抹掉。 -->
<div id="bar" hidden>
  <input id="q" type="search" placeholder="搜尋姓名或內部碼" autocomplete="off">
  <select id="fst"></select>
  <select id="frole"></select>
  <span id="count"></span>
</div>

<div id="list"></div>

<div class="card" id="addcard" hidden>
  <div class="row-title" style="font-size:14px;font-weight:600;margin-bottom:8px;">新增一列</div>
  <div class="fld"><label for="newcode">人</label><select id="newcode"></select></div>
  <div class="fld"><label for="newrole">角色</label><select id="newrole"></select></div>
  <button class="btn btn-sm" id="add" type="button">加進草稿</button>
</div>

<div id="panel" class="idle">還沒有檢查過這份草稿。</div>

<div class="btnrow" id="acts" hidden>
  <button class="btn btn-up" id="check" type="button">檢查</button>
  <button class="btn btn-pri2" id="save" type="button" disabled>存檔</button>
</div>
<div class="msg" id="msg"></div>
<div class="foot" id="foot"></div>

<script>
/**
 * **授權名單維護頁**（gas `#100`，2026-09-17）。
 *
 * ══ 🔴 這一頁真正的價值不是「不用開試算表」═══════════════════════════════
 *
 * 2026-09-16 16:09–16:16 生產環境：授權名單某一列的「角色」空白 ⇒ 七道守恆第 ② 道
 * 沒過 ⇒ **整份作廢** ⇒ 四分鐘內走 LINE 登入的人全部進不去。
 * ⇒ **那是手開試算表才會發生的事**——沒有任何東西擋你存檔。
 *    這一頁要做的，是把守恆從「存檔之後才發現」搬到「**存檔之前擋下來**」。
 *
 * ══ 🔴 這一頁刻意不做什麼 ═══════════════════════════════════════════════
 *
 * **① 它不判斷權限。** 能不能開這一頁，完全由後端 `ACTION_ROLES` 的
 *    `getAuthzList: 'admin'` 決定。前端不看角色、不藏按鈕、不做任何「你是不是 admin」
 *    的判斷——那會變成第二個判準，而分流頁問不到那一層（那正是 `gas#97` 的形狀：
 *    第一道放行、第二道擋下，列得出來卻點不開）。
 *
 * **② 它不自己判斷資料合不合法。** 七道守恆只有一份，在後端的共用規則層。
 *    這一頁**只呈現後端算出來的結果**，不在這裡再寫一份「角色不可以空白」。
 *    寫了就是同一個判斷散在兩處，而兩處分歧時畫面不會報錯——它會理直氣壯地
 *    說一句假話（說「都過了」而存檔被擋，或更糟：說「不能存」而其實可以）。
 *
 * **③ 它不吃 `?t=`、也不產生任何帶 `?t=` 的連結。** 走 LINE 登入，沒有例外。
 *
 * ══ 🔴 「檢查過的那一份」與「現在要送出的那一份」必須是同一份 ═════════════
 *
 * dry-run 的價值來自「他看過的結果，就是即將發生的事」。
 * 所以**任何一個欄位被動到，檢查結果就作廢、存檔鈕就關掉**（`髒()`）。
 * 不這樣做的話，畫面會停在一個綠色的「七道都過」，而他改過的那一格從沒被驗過。
 * ⚠️ 判準是**比對草稿本身**（`JSON.stringify`），不是「有沒有觸發過 change 事件」
 *    ——後者漏掉任何一種輸入方式（貼上、自動填入）就會靜默失效。
 *
 * ⚠️ **存檔那一趟後端會自己再驗一次**，不信任這一頁說「我剛剛驗過了」。
 *    這裡的鎖是為了**他看得到**，不是後端的防線。
 */

var GAS_URL = 'https://script.google.com/macros/s/AKfycbxaDoA_7aOW325p8165VegSqdRL8gRhfTEMfjosdh1A0T4rmzj4Pl7F3k5PToe2po-xtg/exec';
/** 與 index.html／me.html／board.html／line.html 同一條 LIFF，不多開。 */
var LIFF_ID = '2010451233-a781rqsm';

/**
 * 後端 `roles.js` `GATE_REJECT` 的代號 → 要不要給「重新登入」這顆鈕。
 * ⚠️ 跨 repo 的手動對齊，形式沿用 `me.html` 與 `assets/deny-no-role.js` 的既有慣例：
 *    兩邊各有測試釘住自己那半，沒有任何機械的東西逼兩邊相等。
 *    漏掉一個代號的後果是**少一顆鈕**（看得見、他會來問），不是誤導。
 */
var 重登有用的 = { line_no_token: 1, line_bad_token: 1 };

/* ══════════════════════════════════════════════════════════════════════
 * 🔴 憑證死掉時，這一頁**分兩條路**：首載自動重登，有草稿的時候交給他決定
 * ══════════════════════════════════════════════════════════════════════
 *
 * 其他已接上自動重登的頁面是看板——它們手上沒有「還沒送出的輸入」，
 * 所以「自動登出再登入」對它們只是慢一趟。**這一頁不是。**
 *
 * 🔴 **手上有未存資料的時候，「自動」本身就是那個造成損失的動作。**
 *    `liff.login()` 會整頁導走，而 `草稿` 是純記憶體變數（這一頁刻意不做本機暫存，
 *    見下面 `草稿` 的宣告）⇒ **導走＝他編到一半的東西沒了，而且沒有任何地方留著。**
 *
 * ⬛ **這是量過的，不是推論**（2026-09-17，真 Chrome ＋真的這一頁，
 *    `liff.login` 的替身做真的整頁導向）：
 *      受測  編到一半按檢查・憑證死 ＋ 三個呼叫點全接   → 草稿 **WIPED**（logout=1 login=1）
 *      受測  按存檔・憑證死（**驗過的那一份**）＋ 全接  → 草稿 **WIPED**
 *      受測  同兩格、改成只有首載那一發接             → 草稿 **KEPT**
 *      ⬛對照 已知會洗掉（直接整頁導走）              → **WIPED**（尺回得出「有」）
 *      ⬛對照 什麼都不做／`role_mismatch`／存檔成功    → **KEPT**（尺不是一律回 WIPED）
 *    🔴 最難看的是**全接那一版導回來之後畫面上一句錯誤訊息都沒有**
 *      ——面板寫著「改好之後先按檢查」，而他剛加的那一列不見了。
 *
 * ⇒ **首載那一發自動**（那一刻還沒有草稿，沒有東西可以損失）；
 *   **檢查／存檔那兩發不自動**，改成把鈕交回去、並且**先講代價**。
 *
 * ⚠️ 這同時修掉一個**今天就存在**的洞，不是新功能：
 *    `呼叫失敗()`（檢查／存檔的失敗處置）原本連那顆鈕都不給
 *    ⇒ 一個編到一半憑證才死的人，草稿看得見、存不進去、**而且沒有任何一條出路**。
 */

/**
 * 🔴 **使用者唯一的資訊來源。** 他要不要按那顆鈕，唯一的依據就是這句話；
 *    這句話消失、或被改成不含「草稿會不見」的意思，就是一次靜默的損失
 *    ——他會按下去，然後才發現東西沒了。`tests/e2e/authz-relogin.spec.js` 釘著它。
 */
var 草稿會不見警告 = '按下去會離開這一頁重新登入，這份草稿會不見。要留的話請先自己複製起來。';

/** 這個代號重新登入有沒有用。**判準只有這一份**（見上面 `重登有用的`）。 */
function 重登有效(reason) {
  return !!(reason && Object.prototype.hasOwnProperty.call(重登有用的, reason));
}

/**
 * 「重新登入」鈕的樣子。**全頁只有這一份** —— 首載那條與有草稿那條共用同一個處置，
 * 各寫一份的話「先登出再登入」就是同一個判斷散在兩處，而兩處分歧時畫面不會報錯。
 * @param {string} 警告 要先講的代價；首載那條沒有草稿可以損失 ⇒ 傳空字串
 */
function 重登鈕HTML(警告) {
  return (警告 ? '<div style="margin-top:8px">' + esc(警告) + '</div>' : '')
    + '<button class="btn btn-pri" id="relogin" type="button">重新登入</button>';
}

/** 把處置接到剛畫出來的那顆鈕上。沒有那顆鈕就什麼都不做。 */
function 接上重登鈕() {
  var b = el('relogin');
  if (!b) return;
  b.addEventListener('click', function () {
    // 先登出再登入：只呼叫 login 的話 LINE 會直接帶著同一把過期憑證回來。
    try { if (window.liff && liff.isLoggedIn()) liff.logout(); } catch (e) {}
    liff.login({ redirectUri: location.href });      // 保留 query
  });
}

/** 後端送來的：欄名、值域、名冊。**一份都不在這裡寫死。** */
var HDR = [], 角色值域 = [], 狀態值域 = [], 名冊 = [];
/**
 * 後端算好的「角色 ↔ 頁面」（`#117` 的 Ｂ）。形狀：
 * `[{ role, label, pages:[{page,title}] }]`，**整份來自 `getAuthzList` 的 `rolePages`**。
 *
 * 🔴 **這一頁不自己從任何地方推導這張表。** 那不是潔癖：2026-09-17 有人用手寫的正則
 *    去解析後端原始碼算過一次，`'admin,' + MESSAGING_ROLE_SPEC` 被切成 `'admin,'`
 *    ⇒ 算出「那個角色一頁都看不到」，**而那個答案看起來完全合理**。
 * ⚠️ 也**不讀** `tests/fixtures/action-roles.json`：那是測試夾具（由 gas 產、以 sha256 釘著），
 *    讓正式頁面依賴它就是把「測試夾具」升格成「生產相依」。
 */
var 角色頁面 = [];
/** 目前的草稿（資料列，不含表頭）。每一列都是 HDR.length 格。 */
var 草稿 = [];
/** 通過檢查的那一份草稿的字面（null ＝還沒檢查，或檢查後又被改過）。 */
var 驗過的 = null;

function el(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function 欄(name) { return HDR.indexOf(name); }
function 今天() {
  var d = new Date();
  var p = function (n) { return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function setWho(t, isErr) {
  var w = el('who'); w.textContent = t; w.className = isErr ? 'state err' : 'state';
}
function setName(who) { var w = el('who'); w.textContent = who || '已登入'; w.className = ''; }

/** 把整頁換成一段話。**永遠說得出「接下來該做什麼」**。 */
function showMsg(msg, reason) {
  var html = '<div class="card" style="color:var(--bad)">' + esc(msg) + '</div>';
  // 走到這裡＝首載那一發失敗，**草稿還不存在** ⇒ 不必先講「會不見」（那句話會是假的）。
  if (重登有效(reason)) html += 重登鈕HTML('');
  el('list').innerHTML = html;
  el('panel').hidden = true;
  el('acts').hidden = true;
  el('addcard').hidden = true;
  接上重登鈕();
}

/* ══════════════════════════════════════════════════════════════════════
 * 草稿的髒旗標：改了任何一格 ⇒ 檢查結果作廢
 * ══════════════════════════════════════════════════════════════════════ */

function 髒() {
  驗過的 = null;
  el('save').disabled = true;
  面板('idle', '這份草稿改過了，請重新檢查。');
}

function 面板(cls, html) {
  var p = el('panel');
  p.hidden = false;
  p.className = cls;
  p.innerHTML = html;
}

/* ══════════════════════════════════════════════════════════════════════
 * 畫面
 * ══════════════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════════════
 * Ｂ：角色 ↔ 頁面（**只呈現後端算出來的，這裡不做任何推導**）
 * ══════════════════════════════════════════════════════════════════════ */

/** 這個角色的那一筆；查不到回 null（**不編一個**）。 */
function 角色資料(role) {
  var hit = null;
  角色頁面.forEach(function (x) { if (x.role === role) hit = x; });
  return hit;
}

/**
 * 角色的顯示名。有中文就「中文」，沒有就**原封不動顯示代號**。
 * 🔴 退路刻意是「顯示代號」而不是空白：後端哪天多一個角色而中文沒跟上，
 *    畫面要看得出那是一個真的角色，不是一格壞掉的版面。
 * ⚠️ 保證「有中文」的不是這一行，是 gas 的 `tests/role-labels.test.js`
 *    （值域與中文表雙向相等，少一格就紅）。這裡只保證**不會空白**。
 */
function 角色名(role) {
  var d = 角色資料(role);
  return (d && d.label) ? d.label : String(role || '');
}

/**
 * 這幾個角色合起來看得到哪些頁 —— **各角色清單的聯集**。
 *
 * 🔴 「聯集 ＝ 後端真的會給的那一份」不是我假設的，是 gas 的
 *    `tests/role-pages-union.test.js` 把角色值域的**每一個子集**都跑過一遍釘住的。
 *    哪天守門不再是單調的（出現「A 和 B 一起持有反而不行」的規則），那條會紅，
 *    修法是改成由後端算，不是在這裡加一條例外。
 * ⚠️ 順序跟著 `角色頁面` 裡第一次出現的順序走，而那就是後端分流表的順序。
 */
function 聯集頁(roles) {
  var 有 = {}, out = [];
  (roles || []).forEach(function (role) {
    var d = 角色資料(role);
    if (!d) return;
    d.pages.forEach(function (pg) {
      if (有[pg.page]) return;
      有[pg.page] = 1; out.push(pg);
    });
  });
  return out;
}

/** 這一頁上「生效」的判準：狀態不是停用值。**與後端同一條**（只看狀態，不看日期）。 */
function 生效(r, iStat) { return r[iStat] !== 狀態值域[1]; }

/**
 * 同一個人（同內部碼）身上**生效中**的角色。
 * ⚠️ 只看狀態——後端算角色時也只看狀態（授予日／停用日是紀錄欄，不參與判斷，
 *    一手依據：`rules/authz.js` 只在 `stat === STATUS_ACTIVE` 時才把角色記進去）。
 *    這裡多看一個日期，畫面就會跟實際放行的結果分家，而且不會報錯。
 */
function 某人生效角色(code, iCode, iRole, iStat) {
  var out = [];
  草稿.forEach(function (r) {
    if (r[iCode] !== code || !生效(r, iStat)) return;
    if (out.indexOf(r[iRole]) < 0) out.push(r[iRole]);
  });
  return out;
}

function 畫對照表() {
  if (!角色頁面.length) { el('refcard').hidden = true; return; }
  el('refcard').hidden = false;
  el('refsum').textContent = '角色看得到哪些頁（' + 角色頁面.length + ' 個角色）';
  el('refbody').innerHTML = 角色頁面.map(function (d) {
    return '<div class="refrow"><div class="rn">' + esc(d.label || d.role)
      + '<span class="rc">' + esc(d.role) + '</span></div>'
      + '<div class="rp">' + (d.pages.length
          ? d.pages.length + ' 頁：' + d.pages.map(function (p) { return esc(p.title); }).join('、')
          : '（這個角色目前沒有任何頁）') + '</div></div>';
  }).join('')
    + '<div class="refnote">一個人有多個角色時，看得到的是那幾個角色的<strong>聯集</strong>'
    + '——每一列展開後會算給你看。<br>'
    + '這張表由後端現算，跟「實際放不放得進去」是同一份判斷。</div>';
}

/* ══════════════════════════════════════════════════════════════════════
 * 畫面
 * ══════════════════════════════════════════════════════════════════════ */

function opt(值, 現值) {
  return '<option value="' + esc(值) + '"' + (值 === 現值 ? ' selected' : '') + '>' + esc(值) + '</option>';
}

/** 沒有部門的人落腳的那一組。**名字裡的「未填」是講給人看的**：
 *  他們不是不見了，是名冊那一格空的。⬛ 這一組永遠排在具名的組後面。 */
var 未填部門組 = '（未填部門）';

/**
 * 人員下拉（`#newcode`）的內容。**純呈現**——`value` 仍然是內部碼，一個字都不變（`#60`）。
 *
 * 🔴 **人數守恆是這支唯一不能破的約束**：`名冊` 裡有幾個人，吐出來就有幾個
 *    `<option>`（不含最前面那顆「（選一個人）」）。
 *    ⬛ **寫法本身就是那個保證**：這裡走的是**分割**（每個人算出自己的組、丟進那一組），
 *    不是「把有部門的挑出來畫」。後者漏掉的那幾個會靜靜地不見——畫面上是一份看起來
 *    完全正常的清單，而他要找的那個人就是選不到，零錯誤訊息。
 *
 * 🔴 **`分組` 是後端說的，不是這裡推的。** 它來自 `getAuthzList` 的 `rosterUnitColumn`
 *    （gas `#184`）＝「員工名冊到底有沒有『部門』那一欄」。
 *    ⚠️ **不可以改成「看看有沒有人帶得出單位」去猜**：那會把「名冊沒有那一欄」
 *    與「大家的部門真的都是空的」算成同一件事，而這兩件的處置完全不同
 *    （一個要去補欄，一個要去補值）。
 *
 * ⚠️ **組之間的順序＝各組第一個人在 `名冊` 裡出現的順序**，組內維持 `名冊` 的原順序。
 *    兩者都不是這裡發明的規則：`名冊` 由後端按內部碼排好（gas `authzRosterNames_`），
 *    這支一格都沒有重排。
 *    🔴 **刻意不去讀 `getUnitsAndNames` 的 `unitGroups`（總公司／工地）**：那是**另一支端點**
 *    的東西、不在這一發回應裡。把它拉進來＝這一頁多一個資料來源，而那一份會跟名冊
 *    各自老化（名冊新增一個單位、那一份還沒更新 ⇒ 那一組的人靜靜掉進「未填」）。
 *    要改成那種排法是另一個決定。
 *
 * @param {Array<{code:string,name:string,unit:string}>} 名冊 後端 `roster` 原樣
 * @param {boolean} 分組 `false` ⇒ 退回平的清單（逐字等於 `#60` 之前的樣子）
 * @returns {string} `#newcode` 的 innerHTML
 */
function 人員下拉HTML(名冊, 分組) {
  var 有這組 = function (o, g) { return Object.prototype.hasOwnProperty.call(o, g); };
  var 一個 = function (p) {
    return '<option value="' + esc(p.code) + '">' + esc(p.name || '(未填姓名)') + '</option>';
  };
  var 首 = '<option value="">（選一個人）</option>';
  var 清單 = 名冊 || [];
  if (!分組) return 首 + 清單.map(一個).join('');

  var 桶 = {}, 出現順序 = [];
  清單.forEach(function (p) {
    // 前後空白算沒填——留著的話會長出一個名字是空白的組。
    var g = String((p && p.unit) || '').replace(/^\s+|\s+$/g, '') || 未填部門組;
    if (!有這組(桶, g)) { 桶[g] = []; 出現順序.push(g); }
    桶[g].push(p);
  });
  // ⚠️ 不用 `sort` 把未填那一組推到最後——那要依賴排序穩定性才能保住組序。
  //    直接重組：具名的照出現順序，未填的（如果有人）接在後面。
  var 組序 = 出現順序.filter(function (g) { return g !== 未填部門組; });
  if (有這組(桶, 未填部門組)) 組序.push(未填部門組);

  return 首 + 組序.map(function (g) {
    return '<optgroup label="' + esc(g) + '">' + 桶[g].map(一個).join('') + '</optgroup>';
  }).join('');
}

/** Ｄ：停用日那顆鈕的字。**已經有值時要看得出是哪一天。** */
function 停用日鈕(值) {
  return 值 ? '停用日　' + esc(值) : '尚未設定停用日';
}

/**
 * 🔴 **一列＝一行**（`#117` 的 Ａ）。展開後才是原本那幾個欄位。
 *
 * ⚠️ 展開／收合走 class，**不重畫**（見 `.row` 那段 CSS 的理由）。
 *    所以這裡一次把全部列連同 `.det` 都畫出來、靠 CSS 藏起來——
 *    「點開才建立節點」會讓每次展開都重建一次輸入欄位，而那正是會吃掉字的形狀。
 */
function render() {
  var iCode = 欄('內部碼'), iRole = 欄('角色'), iStat = 欄('狀態');
  var iFrom = 欄('授予日'), iTo = 欄('停用日'), iNote = 欄('備註'), iName = 欄('姓名');
  var html = '';
  草稿.forEach(function (r, n) {
    var 停 = r[iStat] === 狀態值域[1];
    var 我的頁 = 聯集頁([r[iRole]]);
    var 他的角色 = 某人生效角色(r[iCode], iCode, iRole, iStat);
    var 他的頁 = 聯集頁(他的角色);
    // 這一列自己看得到什麼；這個人（可能有好幾列）合計看得到什麼。
    var 看得到 = '<div class="seen">這個角色看得到 <b>' + 我的頁.length + ' 頁</b>'
      + (我的頁.length ? '：' + 我的頁.map(function (p) { return esc(p.title); }).join('、') : '')
      + (他的角色.length > 1
          ? '<br>這個人身上生效中的角色有 ' + 他的角色.length + ' 個（'
            + 他的角色.map(function (x) { return esc(角色名(x)); }).join('、')
            + '），合計看得到 <b>' + 他的頁.length + ' 頁</b>：'
            + 他的頁.map(function (p) { return esc(p.title); }).join('、')
          : '')
      + (停 ? '<br>這一列的狀態是「' + esc(狀態值域[1]) + '」⇒ 它不會給這個人任何一頁。' : '')
      + '</div>';

    html += '<div class="row' + (停 ? ' dis' : '') + '" data-n="' + n + '"'
      + ' data-name="' + esc(r[iName] || '') + '" data-code="' + esc(r[iCode] || '')
      + '" data-role="' + esc(r[iRole] || '') + '" data-stat="' + esc(r[iStat] || '') + '">'
      // 摺起來的那一行
      + '<button class="sum" type="button" data-act="exp">'
      + '<span class="caret">▶</span>'
      + '<span class="who">' + esc(r[iName] || '(未填姓名)') + '</span>'
      + '<span class="code">' + esc(r[iCode]) + '</span>'
      + '<span class="tag' + (停 ? '' : ' g') + '">' + esc(角色名(r[iRole])) + '</span>'
      + '<span class="sp"></span>'
      + '<span class="pg">' + (停 ? esc(狀態值域[1]) : 我的頁.length + ' 頁') + '</span>'
      + '</button>'
      // 展開後：原本那幾個欄位，一格都沒少
      + '<div class="det">'
      + '<div class="fld"><label>角色</label><select data-c="' + iRole + '">'
      + 角色值域.map(function (v) { return opt(v, r[iRole]); }).join('')
      // 🔴 值域外的值也要**看得見**，不可以靜靜被下拉選單改成第一個合法值。
      //    今天表上真的有一個拼錯的角色時，畫面顯示成別的字＝把錯誤藏起來。
      + (角色值域.indexOf(r[iRole]) < 0 ? opt(r[iRole], r[iRole]) : '')
      + '</select></div>'
      + '<div class="fld"><label>狀態</label><select data-c="' + iStat + '">'
      + 狀態值域.map(function (v) { return opt(v, r[iStat]); }).join('')
      + (狀態值域.indexOf(r[iStat]) < 0 ? opt(r[iStat], r[iStat]) : '')
      + '</select></div>'
      + '<div class="fld"><label>授予日</label><input data-c="' + iFrom + '" value="' + esc(r[iFrom]) + '"></div>'
      // Ｄ：停用日平常只是一顆鈕，按了才跳出下面那塊。
      // 🔴 這顆鈕**不碰狀態欄**——「把狀態改成停用」與「填一個停用日」是兩件事（gas `#100`）。
      + '<div class="fld"><label>停用日</label>'
      + '<button type="button" class="dbtn' + (r[iTo] ? ' has' : '') + '" data-act="date">'
      + 停用日鈕(r[iTo]) + '</button></div>'
      + '<div class="dpop" hidden>'
      + '<div class="lbl">選一個日期。⚠️ 這一格只是紀錄——要停掉一個人，是把上面的「狀態」'
      + '改成「' + esc(狀態值域[1]) + '」。</div>'
      + '<input type="date" data-c="' + iTo + '" value="' + esc(r[iTo]) + '">'
      + '<div class="rowbtn"><button type="button" class="btn btn-sm btn-grey" data-act="dclr">清除</button>'
      + '<button type="button" class="btn btn-sm btn-up" data-act="dok">收起來</button></div>'
      + '</div>'
      + '<div class="fld"><label>備註</label><input data-c="' + iNote + '" value="' + esc(r[iNote]) + '"></div>'
      + 看得到
      + '</div></div>';
  });
  el('list').innerHTML = html || '<div class="empty">名單是空的。</div>';
  套用篩選();
}

/**
 * Ａ 的另一半：搜尋與篩選。
 *
 * 🔴 **只藏，不刪。** 被藏起來的列**仍然在草稿裡、仍然會被存檔**——
 *    篩選是看的方式，不是選取。所以一定要把「顯示 N／M」寫在畫面上：
 *    少了那一格，他會以為自己在看整份名單。
 * ⚠️ 走 class 切換，**不重畫**（重畫＝把正在打的字連同游標一起換掉）。
 */
function 套用篩選() {
  var q = String(el('q').value || '').toLowerCase().replace(/^\s+|\s+$/g, '');
  var st = el('fst').value, ro = el('frole').value;
  var kids = el('list').children || [];
  var 看得見 = 0, 全部 = 0;
  for (var i = 0; i < kids.length; i++) {
    var d = kids[i];
    if (!d || !d.getAttribute || d.getAttribute('data-n') === null) continue;
    全部++;
    var hay = ((d.getAttribute('data-name') || '') + ' '
             + (d.getAttribute('data-code') || '')).toLowerCase();
    var ok = (!q || hay.indexOf(q) >= 0)
      && (!st || d.getAttribute('data-stat') === st)
      && (!ro || d.getAttribute('data-role') === ro);
    if (ok) { d.classList.remove('hid'); 看得見++; } else { d.classList.add('hid'); }
  }
  排列();
  var c = el('count');
  var 有篩 = !!(q || st || ro);
  c.textContent = 有篩 ? ('顯示 ' + 看得見 + '／' + 全部 + ' 列') : (全部 + ' 列');
  // 🔴 有在篩的時候要看得出來——否則「我的名單只剩 3 列」會被當成事實。
  c.className = 有篩 ? 'on' : '';
}

/**
 * **依人分組**——同一個人的幾列永遠排在一起。
 *
 * ══ 2026-09-17：這裡本來有一顆「原順序／依人分組」的切換，擁有者看過兩種之後
 *    拍板**只留依人分組**，切換連同另一種一起拿掉 ══════════════════════
 * 🔴 **不是「把另一個選項藏起來」，是整顆控制項都不留。** 一個只剩一種值的下拉
 *    佔著版面卻不會改變任何東西——而這張票的成因正是「畫面上東西太多、太長」，
 *    留著它是往反方向走。
 * ⚠️ 要改回可切換的話，**要連 UI 一起加回來**，不要只在這裡加一個參數然後沒有人能按到
 *    （那會變成一條測得到、卻永遠不會被使用者走到的分支）。
 *
 * 🔴 **搬節點，不重畫。** `appendChild` 是把同一顆既有節點移位，
 *    所以輸入框裡的字、游標、已經展開的狀態、以及 `data-n`（它才是草稿的索引）
 *    全都原封不動。重畫一次就會把這些全部換掉，而那正是誤發過一次訊息的形狀。
 * ⚠️ **排序只動看的順序，不動草稿的順序。** 存檔送出的仍然是 `草稿` 本身，
 *    所以「畫面上的第 3 列」與「名單裡的第 3 列」**永遠**不是同一列——
 *    這也是為什麼每一列都自己帶著 `data-n`，而不是靠它在畫面上的位置。
 *    （切換還在的時候這句話只在分組模式成立；現在它無條件成立。）
 */
function 排列() {
  var list = el('list');
  if (!list.children || !list.querySelectorAll) return;
  var 列 = [];
  for (var i = 0; i < list.children.length; i++) {
    var d = list.children[i];
    if (d && d.getAttribute && d.getAttribute('data-n') !== null) 列.push(d);
  }
  if (!列.length) return;
  列.forEach(function (d, i) { d.__i = i; });
  列.sort(function (a, b) {
    // 同一個人排在一起。鍵用**內部碼**不是姓名：姓名可能重複、也可能是空的，
    // 而內部碼才是這張表認人的那一格（`feedback_position_is_not_identity`）。
    var ka = a.getAttribute('data-code') || '', kb = b.getAttribute('data-code') || '';
    if (ka !== kb) return ka < kb ? -1 : 1;
    return a.__i - b.__i;   // 同一個人的幾列之間維持原順序（穩定）
  });
  列.forEach(function (d) { list.appendChild(d); });
}

/**
 * 從某個節點往上找到它屬於哪一列（`data-n`）。
 *
 * 🔴 **一路往上走，不是「往上兩層」。** 舊版寫的是
 *      `var box = f.parentNode && f.parentNode.parentNode;`
 *    ——那句把「欄位剛好在列的第二層」寫成了程式的前提。
 *    `#117` 把一列改成「摺起來那一行 ＋ 展開的細節」之後，欄位變成第三層，
 *    而那句會取到 `.det` ⇒ `data-n` 是 null ⇒ **直接 return**
 *    ⇒ 草稿不會被更新、而且**也不會變髒**。
 * 🔴 那個壞法的長相是：他改了一格、畫面停在綠色的「七道都過」、
 *    按下存檔送出的是**沒有他那一格的舊草稿**——零錯誤訊息。
 * ⇒ 改成往上走到底，就再也不依賴巢狀有幾層。
 */
function 哪一列(node) {
  var el0 = node;
  while (el0) {
    if (el0.getAttribute && el0.getAttribute('data-n') !== null) return el0;
    el0 = el0.parentNode;
  }
  return null;
}

/**
 * 這一列裡所有綁在同一欄的輸入框都跟著同步（停用日有兩個入口：日期鈕與 `type=date`）。
 *
 * 🔴 **更新鈕面那一段只准在「改的是停用日那一欄」時跑。**（2026-09-17 修）
 *    第一版沒有問是哪一欄，而 `接上監聽` 對**每一格**輸入都呼叫這支
 *    ⇒ 在備註打字會把鈕面改成備註的內容、清空備註會把 `has` 樣式拔掉
 *    （「已設」與「沒設」在畫面上變成一樣）。
 * 🔴 **而這一顆特別惡性**：不是 ISO 形狀的停用日（`2026/03/15`、`未定`）
 *    **全頁只有鈕面看得到它**——`<input type="date">` 吃不下那種值，顯示成空白。
 *    鈕面一被蓋掉，那個值在畫面上再也顯示不出來，而草稿裡還留著
 *    ⇒ 使用者看到「尚未設定停用日」，於是去設一個，把原值覆蓋掉。**零錯誤訊息。**
 * ⚠️ 它躲過了所有既有的尺：行為量測看的是 `JSON.stringify(草稿)`（草稿確實沒動，
 *    壞的是呈現），而單元測試的假 DOM `querySelector` 回 null（那四行從沒被執行過）。
 *    釘住它的是 `tests/authz-page-wiring.test.js` 裡那條**自備「查得到子元素」假列**的案例。
 */
function 同步同欄(列, c, 值) {
  if (!列 || !列.querySelectorAll) return;
  var all = 列.querySelectorAll('[data-c="' + c + '"]');
  for (var i = 0; i < all.length; i++) { if (all[i].value !== 值) all[i].value = 值; }
  // 🔴 這一問就是上面整段在講的那件事。拿掉它，改任何一欄都會蓋掉鈕面。
  if (Number(c) !== 欄('停用日')) return;
  var b = 列.querySelector('[data-act="date"]');
  if (b) {
    b.textContent = 停用日鈕(值);
    if (值) b.classList.add('has'); else b.classList.remove('has');
  }
}

/**
 * 🔴 監聽掛在**容器**上、走冒泡，不是掛在每一個 input 上。
 *    掛在子元素上的話，`render()` 換掉 innerHTML 之後全部掉光，
 *    而「改了卻沒變髒」是靜默的——畫面會停在綠色的「都過了」。
 */
function 接上監聽() {
  ['input', 'change'].forEach(function (ev) {
    el('list').addEventListener(ev, function (e) {
      var f = e.target;
      if (!f || f.getAttribute == null) return;
      var c = f.getAttribute('data-c');
      if (c === null) return;
      var box = 哪一列(f);
      var n = box && box.getAttribute ? box.getAttribute('data-n') : null;
      if (n === null) return;
      草稿[Number(n)][Number(c)] = f.value;
      // 停用日有兩個入口指向同一格，改了一個另一個要跟著（否則畫面會顯示兩個不同的值）。
      同步同欄(box, c, f.value);
      髒();
    });
  });

  /**
   * 展開／收合、以及 Ｄ 的停用日那顆鈕。
   *
   * ⚠️ 這幾件事**一律用 class／hidden 切換，不重畫清單**。
   *    重畫會把使用者正在打的字、游標位置、以及其他已經展開的列一起換掉
   *    （`feedback_swr_repaint_eats_user_input`：這一頁整頁都是輸入欄位）。
   * 🔴 這裡**一格資料都不動**——展開、收合、開關日期面板都不會改到草稿，
   *    所以也不會（也不可以）把檢查結果弄髒。
   */
  el('list').addEventListener('click', function (e) {
    var t = e.target;
    // 點在 <button> 裡的 <span> 上時，target 是那個 span ⇒ 往上找帶 data-act 的那一顆。
    while (t && (!t.getAttribute || t.getAttribute('data-act') === null)) {
      if (t === el('list')) return;
      t = t.parentNode;
    }
    if (!t || !t.getAttribute) return;
    var act = t.getAttribute('data-act');
    var 列 = 哪一列(t);
    if (!列) return;
    if (act === 'exp') { 列.classList.toggle('open'); return; }

    var pop = 列.querySelector ? 列.querySelector('.dpop') : null;
    if (!pop) return;
    if (act === 'date') { pop.hidden = !pop.hidden; return; }
    if (act === 'dok') { pop.hidden = true; return; }
    if (act === 'dclr') {
      // 清除＝把那一格變成空字串。**走跟使用者自己刪掉一樣的路**：
      // 寫草稿 → 同步畫面 → 變髒，一步都不少。
      var n = 列.getAttribute('data-n');
      var d = 列.querySelector('.dpop [data-c]');
      if (n === null || !d) return;
      var c = d.getAttribute('data-c');
      草稿[Number(n)][Number(c)] = '';
      同步同欄(列, c, '');
      髒();
    }
  });
}

/* ══════════════════════════════════════════════════════════════════════
 * 三個動作：新增、檢查、存檔
 * ══════════════════════════════════════════════════════════════════════ */

function 新增() {
  var code = el('newcode').value;
  var role = el('newrole').value;
  if (!code) { el('msg').className = 'msg err'; el('msg').textContent = '請先選一個人。'; return; }
  var 那個人 = null;
  名冊.forEach(function (p) { if (p.code === code) 那個人 = p; });
  var r = [];
  for (var i = 0; i < HDR.length; i++) r.push('');
  r[欄('內部碼')] = code;
  r[欄('角色')] = role;
  r[欄('狀態')] = 狀態值域[0];
  r[欄('授予日')] = 今天();
  r[欄('姓名')] = 那個人 ? 那個人.name : '';
  草稿.push(r);
  el('msg').textContent = '';
  render();
  髒();
  帶他去看(草稿.length - 1);
}

/**
 * 剛加進來的那一列，**要讓他看得到**。
 *
 * ══ 為何需要這一段（2026-09-17，拿掉「原順序」的直接後果）════════════
 *
 * 清單現在**永遠依人分組**（照內部碼排），所以新加的一列不會出現在最下面，
 * 而是被排進那個人所在的位置——50 列的時候那通常在畫面外。
 * 更糟的是**目前正在篩選**的話，新列可能直接被篩掉 ⇒ 他按了「加進草稿」，
 * 畫面上**什麼事都沒發生**，而那一列其實已經在草稿裡了。
 * 🔴 這兩種都不會報錯，看起來就像「按鈕壞了」——而他的下一個動作很可能是再按一次。
 *
 * ⚠️ **只動看的東西，一格資料都不碰**：清篩選、捲過去、加一個記號。
 *    篩選本來就是「看的方式」（見 `套用篩選` 檔頭），清掉它不會改變存檔送出的內容。
 * ⚠️ 清篩選之後走 `套用篩選()`，**不是 `render()`**——重畫會把其他列正在打的字換掉。
 */
function 帶他去看(n) {
  var 那一列 = el('list').querySelector
    ? el('list').querySelector('[data-n="' + n + '"]') : null;
  if (!那一列) return;
  // 被目前的篩選擋住的話才清篩選——沒擋住就不要動他設好的條件。
  if (那一列.className.indexOf('hid') >= 0) {
    el('q').value = ''; el('fst').value = ''; el('frole').value = '';
    套用篩選();
  }
  if (那一列.classList) 那一列.classList.add('new');
  if (那一列.scrollIntoView) 那一列.scrollIntoView({ block: 'center' });
}

function 檢查() {
  var 這一份 = JSON.stringify(草稿);
  el('check').disabled = true;
  return gasCall(GAS_URL, 'checkAuthzDraft', { idToken: freshIdToken(), rows: 這一份 })
    .then(function (r) {
      el('check').disabled = false;
      if (!r || r.ok !== true) { 呼叫失敗(r); return; }
      var 變更 = (r.changes || []).length
        ? '<ul>' + r.changes.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul>'
        : '<div style="margin-top:6px">（與現在的名單沒有差異）</div>';
      if (r.pass) {
        // 🔴 鎖的是**這一份**：檢查回來之前他又改了的話，下面那個比對會不相等。
        驗過的 = 這一份;
        el('save').disabled = (JSON.stringify(草稿) !== 這一份);
        面板('pass', '七道守恆＋自鎖防護<span class="gate"> 全部通過</span>'
          + '（' + r.rowCount + ' 列，其中生效的 admin ' + r.adminCount + ' 位）'
          + '<div style="margin-top:8px">按下存檔會發生這些事：</div>' + 變更
          + (el('save').disabled ? '<div style="margin-top:8px">⚠️ 檢查回來之前草稿又被改過了，請重新檢查。</div>' : ''));
      } else {
        驗過的 = null;
        el('save').disabled = true;
        面板('fail', '<span class="gate">' + esc(r.gate) + '</span> 沒有通過：' + esc(r.detail)
          + '<div style="margin-top:8px">改好上面那一列再按一次檢查。<strong>這份草稿還沒有被寫進去。</strong></div>');
      }
    });
}

function 存檔() {
  if (驗過的 === null || JSON.stringify(草稿) !== 驗過的) { 髒(); return Promise.resolve(); }
  el('save').disabled = true;
  el('check').disabled = true;
  return gasCall(GAS_URL, 'saveAuthzList', { idToken: freshIdToken(), rows: 驗過的 })
    .then(function (r) {
      el('check').disabled = false;
      if (!r || r.ok !== true) { 呼叫失敗(r); return; }
      var 變更 = (r.changes || []).map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('');
      // 🔴 留痕沒寫成功要**說出來**：資料已經進去了，包起來不講比不回報更糟。
      var 痕 = r.logged
        ? '<div style="margin-top:8px">已記到「' + esc(r.logSheet) + '」。</div>'
        : '<div style="margin-top:8px">⚠️ 資料已存檔，但<strong>異動紀錄沒有寫成功</strong>（'
          + esc(r.logError) + '）。請把這句話告訴資訊人員。</div>';
      驗過的 = null;
      // 🔴 **重新載入不可以蓋掉這段結果。** 留痕失敗那句話就在裡面，蓋掉＝
      //    「包起來不講」的另一種長相（這一格是被 `tests/authz-page-wiring.test.js` 叫回來改的）。
      //    ⇒ `load(null)` 明說「不要動面板」，載完之後才由這裡把結果寫上去。
      var 結果 = '已存檔（' + r.rowCount + ' 列，生效的 admin ' + r.adminCount + ' 位）。'
        + (變更 ? '<ul>' + 變更 + '</ul>' : '') + 痕;
      return load(null).then(function () {
        面板('pass', 結果 + '<div style="margin-top:8px">名單已重新載入。要再改的話，改完按檢查。</div>');
      });
    });
}

/** 一次呼叫沒有成功。**傳輸失敗與「伺服器說不行」要分開講**：一個重試有用、一個永遠沒用。 */
function 呼叫失敗(r) {
  驗過的 = null;
  el('save').disabled = true;
  // 🔴 憑證死掉時**給鈕、但不自動按**——這一刻草稿在他手上（理由見上面那一段）。
  //    ⚠️ 鈕與代價要一起出現：只給鈕等於讓他在不知道代價的情況下按下去。
  面板('fail', esc((r && r.msg) || '呼叫失敗。')
    + (r && r.transport ? '<div style="margin-top:8px">這是連線問題，請確認網路後再按一次。</div>'
                        : '<div style="margin-top:8px">這不是連線問題，重按不會好。</div>')
    + (重登有效(r && r.reason) ? 重登鈕HTML(草稿會不見警告) : ''));
  接上重登鈕();
}

/* ══════════════════════════════════════════════════════════════════════
 * 載入
 * ══════════════════════════════════════════════════════════════════════ */

function freshIdToken() {
  if (!(window.liff && typeof liff.getIDToken === 'function')) return '';
  var t = liff.getIDToken();
  return t ? String(t) : '';
}

/**
 * @param {string|null} 面板訊息 要寫進面板的那句話；**`null` ＝不要動面板**
 *        （存檔之後那一趟用它：那裡的面板正放著剛剛的結果，蓋掉就等於把它吞了）。
 */
function load(面板訊息) {
  // 憑證在呼叫當下才取，不是開頁時取一次存起來（它只有效一小時）。
  return gasCall(GAS_URL, 'getAuthzList', { idToken: freshIdToken() })
    // 解析出口接 `assets/liff-relogin.js`：**與已接上的那幾頁同一條路**，不在這裡另寫一份。
    // 🔴 **只有這一發自動**（這一刻還沒有草稿）——檢查／存檔那兩發刻意不接，見上面那一段。
    .then(reloginOnDeadCredential)
    .then(function (r) {
    if (!r || r.ok !== true) {
      if (r && r.transport) {
        setWho('連不上伺服器', true);
        showMsg((r && r.msg) || '連線失敗。請確認網路後重新整理。', '');
        return;
      }
      setWho('無法確認您的權限', true);
      showMsg((r && r.msg) || '目前無法取得授權名單，請稍後再試。', r && r.reason);
      return;
    }
    setName(r.who);
    HDR = r.header || [];
    角色值域 = r.assignableRoles || [];
    狀態值域 = r.statusValues || [];
    名冊 = r.roster || [];
    // Ｂ：角色 ↔ 頁面。**後端沒送就是沒有**——不在這裡湊一份出來。
    // ⚠️ 後端還沒上這一格時，`角色頁面` 是空陣列 ⇒ 對照表整張收起來、
    //    角色顯示退回原代號、頁數那一格顯示 0。難看，但不會說假話。
    角色頁面 = r.rolePages || [];
    草稿 = (r.rows || []).map(function (row) { return row.slice(); });
    驗過的 = null;

    el('addcard').hidden = false;
    el('acts').hidden = false;
    el('bar').hidden = false;
    el('save').disabled = true;
    畫對照表();
    // 篩選的值域也來自後端那一發，**不寫死**。第一個選項是「全部」（空字串）。
    el('fst').innerHTML = '<option value="">全部狀態</option>'
      + 狀態值域.map(function (v) { return '<option value="' + esc(v) + '">' + esc(v) + '</option>'; }).join('');
    el('frole').innerHTML = '<option value="">全部角色</option>'
      + 角色值域.map(function (v) {
          return '<option value="' + esc(v) + '">' + esc(角色名(v)) + '</option>';
        }).join('');
    // 🔴 **分組成不成立由後端那一格決定**（`rosterUnitColumn`，gas `#184`），
    //    不是這裡看資料猜的。`=== true` 是刻意的：後端沒送這一格（舊版）時
    //    退回平的清單＝逐字等於 `#60` 之前的樣子，而不是替它編一個答案。
    el('newcode').innerHTML = 人員下拉HTML(名冊, r.rosterUnitColumn === true);
    el('newrole').innerHTML = 角色值域.map(function (v) { return opt(v, 角色值域[0]); }).join('');

    // 🔴 **現況過不過，一進來就講。** 名單今天是壞的時候，他要先知道自己在修什麼；
    //    而這一頁**不會因此打不開**——修它的那一頁跟著壞掉，就又只剩下開試算表這條路。
    el('meta').innerHTML = r.current && r.current.pass
      ? '現在的名單通過七道守恆（' + r.current.rowCount + ' 列，生效的 admin ' + r.current.adminCount + ' 位）。'
      : '<span style="color:var(--bad)">⚠️ 現在的名單<strong>沒有</strong>通過七道守恆：'
        + esc((r.current && r.current.gate) || '') + '　'
        + esc((r.current && r.current.detail) || '')
        + '　⇒ 角色來源此刻已退回 token 白名單。改好之後存檔就會恢復。</span>';

    if (面板訊息 !== null) 面板('idle', 面板訊息);
    render();
    // 🔴 名冊有碰撞（同一個內部碼出現兩次）時**要講**：那幾個人在上面的下拉裡選不到，
    //    而「選不到」與「這個人沒有內部碼」的處置完全不同。
    // 🔴 **分組沒有成立的時候要講，而且兩個原因要分得出來**（`#60`）：
    //    「名冊沒有部門欄」（去補一欄）與「後端還沒送這一格」（去部署）處置完全不同，
    //    而兩者在畫面上長得一模一樣——都是一份平的清單。
    //    ⚠️ 靜靜地不分組＝後端已經知道分組不會成立、而他看不出來，等於沒講。
    var 腳註 = [];
    if (r.rosterCollisions && r.rosterCollisions.length) {
      腳註.push('⚠️ 員工名冊有 ' + r.rosterCollisions.length
        + ' 個重複的內部碼，那幾位在上面的清單裡選不到，要先請人把名冊修好。');
    }
    if (r.rosterUnitColumn === false) {
      腳註.push('⚠️ 員工名冊沒有「部門」欄 ⇒ 上面的人員清單暫時不分組（是平的一整串）。');
    } else if (typeof r.rosterUnitColumn !== 'boolean') {
      腳註.push('⚠️ 這一發沒有回報名冊有沒有「部門」欄（後端可能還是舊版）'
        + ' ⇒ 上面的人員清單暫時不分組。');
    }
    el('foot').textContent = 腳註.join('　');
  });
}

function start() {
  el('add').addEventListener('click', 新增);
  // 篩選列在 `#list` 外面 ⇒ 重畫清單不會動到它，他打到一半的搜尋字不會被抹掉。
  ['input', 'change'].forEach(function (ev) {
    el('q').addEventListener(ev, 套用篩選);
    el('fst').addEventListener(ev, 套用篩選);
    el('frole').addEventListener(ev, 套用篩選);
  });
  el('check').addEventListener('click', 檢查);
  el('save').addEventListener('click', 存檔);
  接上監聽();

  if (!(window.liff && typeof liff.init === 'function')) {
    setWho('LINE 元件沒有載入', true);
    showMsg('LINE 的元件沒有載入成功，沒辦法確認您的身分。'
      + '請確認網路正常後重新整理；一直這樣的話請找資訊人員。', '');
    return;
  }
  return liff.init({ liffId: LIFF_ID }).then(function () {
    if (!liff.isLoggedIn()) {
      setWho('正在前往 LINE 登入，登入後會自動回到這一頁…', false);
      liff.login({ redirectUri: location.href });
      return;                                  // 導頁中，不要發車
    }
    if (!freshIdToken()) {
      setWho('拿不到登入憑證', true);
      showMsg('已經登入 LINE，但拿不到這一頁需要的憑證。'
        + '這是 LINE 後台的設定問題，重新整理不會好，請找資訊人員。', '');
      return;
    }
    return load('改好之後先按「檢查」，看過七道守恆的結果再存檔。');
  }).catch(function (err) {
    // **不靜默**：否則畫面只會停在「確認身分中…」，而查不出是哪一段。
    setWho('確認身分時失敗', true);
    showMsg('確認身分時失敗：' + ((err && err.message) ? err.message : String(err)), '');
  });
}

start();
</script>
<script src="assets/back-to-me.js" defer></script>
