name: 前端單元測試

# 為什麼有這支（2026-08-19）：本 repo 原本只有 syntax-check.yml，tests/ 底下的
# 測試沒有任何 workflow 會跑。看板快取那批改動寫進數十條測試，沒有閘門等於它們
# 擋不住任何東西——推 main 即 Pages 發布，改壞了沒人會知道。

on:
  push:
    branches: [main]
    # ⚠️ `tests/**` 不寫成 `tests/**.js`：`tests/fixtures/action-roles.json`（後端產的
    #    權限矩陣副本）是 page-action-gate 的判斷依據，只改它而不觸發 CI
    #    ＝**改了守門的依據卻沒有任何東西重跑守門**，而且完全靜默。
    paths: ['**.html', 'assets/**.js', 'tests/**', '.github/workflows/test.yml']
  pull_request:
    # 🔴 這兩份清單必須逐字相同（含 `.github/workflows/test.yml` 自己那一格）。
    #    少了自己那一格 ⇒ 改壞這支的 PR 不會跑這支，要等合併進 main 才知道，
    #    而失敗方向是「檢查清單上少了一格」，不是紅燈——零錯誤訊息。
    paths: ['**.html', 'assets/**.js', 'tests/**', '.github/workflows/test.yml']
  workflow_dispatch: {}

# ══ concurrency（jdc-tw-org 全組織 workflow 規範 ②，jdc-tw-migration#101）══
#   PR：以 PR 為單位，同一個 PR 再推一次就取消前一次（舊 commit 的結果沒人要看）。
#   push main／手動：group 用 ref，cancel 算式對非 PR 事件為 false ⇒ 排隊、不取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # timeout（規範 ①）：最近 100 次完成的 run 最長 80 秒（2026-09-29，run 36501975225）。×3＝240 秒，
    #   取整後低於 5 分一律拉到 5 分（runner 偶發慢不該誤殺）。
    #   量法：`gh run list -w test.yml -L 100`＋`gh api .../runs/<id>/jobs` 的 started_at→completed_at。
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '20' }
      # ⚠️ 必須用萬用字元 tests/*.test.js。寫成目錄形式 `node --test tests/`
      # 在新版 Node 會噴 Cannot find module。
      - run: node --test tests/*.test.js
