<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>活動出席狀況</title>
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
<link rel="stylesheet" href="assets/ui.css">
<style>
  /* 🔴 色票、body、.card、.empty、.meta 來自 `assets/ui.css`。這裡只放這一頁自己的。 */

  /* 會場用：字級大一階，下面有 768px 斷點再放大。 */
  body { font-size: 17px; }
  .brand { margin: 0 0 14px; }
  .brand img { max-width: 240px; }
  h1 { margin-bottom: 4px; }
  .meta { font-size: 14px; }
  .picker { width: 100%; font-size: 15px; padding: 8px 10px; border: 1px solid var(--ln);
    border-radius: 8px; margin-bottom: 10px; display: none; background: #fff; color: var(--ink); }
  .card { padding: 20px; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; text-align: center; }
  .num { font-size: 26px; font-weight: 700; color: var(--ink); }
  /* 三色職責（見 ui.css 檔頭）：綠＝正常與已完成、紅＝例外與注意、灰＝尚未。 */
  .num.green { color: var(--g); } .num.red { color: var(--bad); } .num.grey { color: var(--ink3); }
  .cap { font-size: 13px; color: var(--ink3); }
  .sub { font-size: 14px; color: var(--ink2); margin-top: 12px; text-align: center; }
  .sec { font-size: 16px; color: var(--ink2); margin: 24px 0 10px; font-weight: 600; }
  /* `.grp` 是可展開的群組，不是 `.card`（它要 overflow:hidden 才收得住 summary 的底色）。 */
  .grp { background: #fff; border: 1px solid var(--ln); border-radius: 3px; margin-bottom: 8px; overflow: hidden; }
  .grp summary { padding: 12px 14px; cursor: pointer; font-weight: 600; list-style: none; display: flex; align-items: baseline; gap: 8px; }
  .grp summary::-webkit-details-marker { display: none; }
  .grp summary::before { content: '▸'; color: var(--ink3); font-size: 13px; transition: transform .15s; }
  .grp[open] summary::before { transform: rotate(90deg); }
  .grp .cnt { color: var(--ink3); font-weight: 400; font-size: 14px; }
  .grp .body { padding: 0 14px 12px 30px; }
  .names { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 15px; color: var(--ink2); }
  .p { padding: 4px 0; border-bottom: 1px solid var(--ln); }
  .p:last-child { border-bottom: none; }
  .p .n { font-weight: 600; }
  .p .att { font-size: 12px; padding: 1px 7px; border-radius: 3px; margin-left: 8px; }
  .att-y { background: var(--g-bg); color: var(--g); }
  .att-n { background: var(--bad-bg); color: var(--bad); }
  .p .op { font-size: 14px; color: var(--ink2); display: block; margin-top: 2px; }
  /* 🔴 大螢幕斷點：會場投影用。一致的是語彙（顏色、線、圓角），不是尺寸。 */
  @media (min-width: 768px) {
    body { max-width: 720px; padding: 32px 24px 60px; font-size: 18px; }
    h1 { font-size: 25px; } .num { font-size: 32px; } .cap { font-size: 14px; }
    .card { padding: 26px 30px; } .sec { font-size: 18px; }
  }
</style></head><body>
<div class="brand"><img src="assets/logo-full.svg" alt="日商日本國土開發股份有限公司台灣分公司"></div>
<h1 id="title">活動出席狀況</h1>
<select id="act-picker" class="picker" onchange="load(this.value)"></select>
<div id="meta" class="meta">載入中…</div>
<!-- 🔴 id="load-ph" 是「這一區還沒有人畫過東西」的**結構性**標記（見下方監看器那段）。
     不要拿掉，也不要改成靠比對「載入中…」這四個字——文案會被改，節點不會自己回來。 -->
<div id="content"><div class="empty" id="load-ph">載入中…</div></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="assets/url-token.js"></script>
<!-- 憑證死掉時真的重新登入一次（後端叫人「關掉重開」在結構上是 no-op，見該檔檔頭） -->
<script src="assets/liff-relogin.js"></script>
<script src="assets/stats-view.js"></script>
<script src="assets/board-cache.js"></script>
<script>
// 失效面（2026-07-31 補）：esc() 與 renderStatsHtml() 都住在 assets/stats-view.js。
// 原本連「顯示錯誤訊息」那行也呼叫 esc()，所以那支一旦沒載進來，連錯誤訊息都會拋例外，
// 畫面就靜靜停在「載入中」——跟 7/31 index.html 卡住一天是同一個形狀：壞掉時沒有任何人看得見。
// 以下讓「載入失敗」一定講得出話來。
if(typeof esc!=='function'){window.esc=function(s){return (s==null?'':s).toString().replace(/</g,'&lt;');};}
function fatal(msg){
  try{
    var m=document.getElementById('meta'); if(m)m.textContent='';
    var c=document.getElementById('content'); if(c)c.innerHTML='<div class="empty">'+esc(msg)+'</div>';
  }catch(e){}
}
/* ══ 「載入中…」一定會收斂（#102，2026-09-16）════════════════════════════════
 *
 * 🔴 **出口只有上面那個 fatal()。** 本段不長第二個講法，只是多兩個觸發它的理由。
 *
 * 為何需要：本頁所有打後端的路都是 `AUTH_READY.then(...)` 起頭的 promise 鏈，
 * 而**那些鏈上一個 `.catch` 都沒有**。鏈上任一處拋例外（回應少一個欄位、共用模組是
 * 舊版而少一個函式、快取裡是舊格式），rejection 沒有人接 ⇒ 畫面停在同步佔位的
 * 「載入中…」，永遠不會變、也不會有任何錯誤提示。跟 7/31 那條舊傷同一個形狀：
 * **壞掉時沒有任何人看得見。** 重現見 `tests/e2e/attend-loading-converges.spec.js`。
 *
 * 兩個觸發理由，職責不同、缺一不可：
 *   ① `chainFailed()` —— 鏈上**拋例外**時當場講，而且講得出是哪一段、什麼錯。
 *   ② 監看器          —— 鏈**既不 resolve 也不 reject**時的保底（佇列前面那支卡住、
 *      走了 `v==='revoked'` 的提早 return 而覆蓋層沒蓋上）。①對這一種完全無效。
 *
 * 🔴 **「下一次有人在這頁加一條新的載入路徑、又忘了收斂，誰會被迫看到」＝開這一頁的人。**
 *    監看的述詞刻意是「那個佔位節點還在不在」，不是布林旗標、更不是比對文案：
 *    新路徑要嘛換掉 `#content`（自動解除），要嘛沒換掉（被講出來）。
 *    寫新路徑的人不必記得任何事，也繞不過去。
 *
 * ⚠️ 秒數一定要**大於 `jsonp` 的 15 秒逾時**。小於它的話，保底那句會蓋掉
 *    「連線逾時（伺服器喚醒中）」——那是拿一個講不清楚的失敗換掉一個講得清楚的。
 */
var LOAD_GUARD_MS=25000;
var _loadGuard=null;
var _lastFailure='';

/** 佔位節點還在＝這一區從頭到尾沒有人畫過東西。 */
function stillLoading(){return !!document.getElementById('load-ph');}

/** 同步佔位＋上發條。「我要開始載入了」一律走這裡，不要自己寫那兩行。 */
function beginLoading(){
  var m=document.getElementById('meta'); if(m)m.textContent='載入中…';
  var c=document.getElementById('content');
  if(c)c.innerHTML='<div class="empty" id="load-ph">載入中…</div>';
  armLoadGuard();
}

function armLoadGuard(){
  if(_loadGuard)clearTimeout(_loadGuard);
  _loadGuard=setTimeout(function(){
    if(!stillLoading())return;          // 已經有人畫過東西了，沒事
    fatal('資料一直沒有回來'+(_lastFailure?'（'+_lastFailure+'）':'')
      +'。請按頁尾的「抓最新版」再試一次；若還是一樣，請找資訊人員。');
  },LOAD_GUARD_MS);
}

/** 非同步鏈的統一收尾。記下原因（監看器會引用），畫面上還是空白就當場講。 */
function chainFailed(where){
  return function(e){
    _lastFailure=where+'：'+((e&&e.message)||e);
    try{if(window.console&&console.error)console.error('[attend] '+where,e);}catch(_){}
    if(stillLoading())fatal('載入時發生錯誤（'+_lastFailure+'），請重新整理。');
  };
}
// 開頁就上發條：連 init() 的首載都還沒發車就掛掉（例如共用模組沒載進來），一樣要講得出話。
armLoadGuard();

var GAS_URL='https://script.google.com/macros/s/AKfycbxaDoA_7aOW325p8165VegSqdRL8gRhfTEMfjosdh1A0T4rmzj4Pl7F3k5PToe2po-xtg/exec';
// 取值走共用的 assets/url-token.js（E1a 收攏的那一支，board／hr-stats 已在用）。
// ⚠️ 刻意保留 `q(k)` 這個名字當薄包裝，不改呼叫端（同 hr-stats.html 的理由：
//    改名會讓這次的 diff 同時含「換來源」與「改名」兩件事，後者會把前者藏起來）。
function q(k){return urlParam(k);}
// fetch 匿名(credentials:'omit')：JSONP script 會帶瀏覽器 Google session，帳號狀態半殘的電腦被 Google 拒絕
function jsonp(action,params,timeoutMs){
  // 🔴 **憑證只掛在這一個地方**（同 board.html／hr-stats.html 的 jsonp）。
  // ⚠️ ID token 在呼叫當下才取（它只有效一小時；見 hr-stats.html 同位置的更正：
  //    這一格不是防線，真正的處置在 assets/liff-relogin.js）。
  // ⚠️ 條件是 `!TOKEN`：帶 `?t=` 的舊路**不可以**順手帶 idToken 上去，
  //    那會打到後端 `doGet` 的分流條件、把舊路整條改道。
  var p={};
  Object.keys(params||{}).forEach(function(k){p[k]=params[k];});
  if(!TOKEN){var fresh=freshIdToken();if(fresh)p.idToken=fresh;}
  params=p;
  var qs=Object.keys(params||{}).filter(function(k){return params[k]!=='';}).map(function(k){return '&'+encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('');
  // 逾時不靠 AbortController：iOS 12.1 以前沒有它，`new AbortController()` 會直接 ReferenceError，
  // 讓整段 init 同步當掉 → 畫面永遠停在「載入中」且不顯示任何錯誤（2026-07-31 查本頁時發現）。
  // 改用 Promise.race 計時：舊瀏覽器一樣有逾時，代價只是底層請求不會被真的取消（低頻看板無影響）。
  var timer, timeout=new Promise(function(_,rej){timer=setTimeout(function(){var e=new Error('timeout');e.name='AbortError';rej(e);},timeoutMs||15000);});
  return Promise.race([timeout, fetch(GAS_URL+'?action='+encodeURIComponent(action)+qs+'&callback=cb',{credentials:'omit',redirect:'follow'})
    .then(function(r){return r.text();})
    .then(function(t){var a=t.indexOf('('),b=t.lastIndexOf(')');if(a===-1||b===-1)throw new Error('bad');return reloginOnDeadCredential(JSON.parse(t.slice(a+1,b)));})])
    .then(function(v){clearTimeout(timer);return v;})
    .catch(function(e){clearTimeout(timer);return {ok:false,msg:(e&&e.name==='AbortError')?'連線逾時（伺服器喚醒中），請重新整理再試。':'連線失敗，請重新整理。'};});}
var TOKEN=q('t');

/* ══ E1b：這一頁有兩條進來的路（2026-09-13，照 hr-stats.html 的做法）══════════
 *
 *   ① 網址帶 `?t=`  → **舊路，送出去的請求與改動前逐字相同**（副總手上那條連結）。
 *   ② 網址沒有 `?t=` → **LINE 登入**。帶 idToken 上去，後端驗簽→換內部碼→查名冊。
 *
 * 🔴 分流依據是「網址上有沒有那串」，不是開關 ⇒ 退路就是「把舊連結給他」，不必部署。
 *
 * 🔴 **②要能用，後端原本還缺一格——已解除**（解除條件：gas 的 `runBatch_` 子項在 LINE 路不再吃 `p.token`）：
 *    本頁首載是 `batch{listActivities, getActivityStats}`。原本 `Code.js` 的 `runBatch_`
 *    對每支子項重跑 `gateAction(a, p.token || '')`——②的 token 是空字串
 *    ⇒ 兩支子項都回 `token_invalid`「無權限或連結已失效。」（2026-09-13 本機實跑 roles.js／batch.js 確認）
 *    ⇒ 解除證據：jdc-line-gas `dbc8b17`（外層身分 `source === 'line'` ⇒ 子項改問 `gateLineIdentity`），
 *       隨 gas main `04022c4` 於 2026-09-13 17:03:49 上線；本機測試見 gas
 *       `line-platform/tests/batch-line-identity.test.js` 的「attend 首載」那一條。
 *    ⚠️ 解除的只是「後端缺一格」這個成因。**線上仍沒有人用 LINE 實際開過本頁 ⇒ ②在線上還沒驗過。**
 */
var LIFF_ID='2010451233-a781rqsm';   // 與 index／welfare／board／hr-stats 同一條，不多開 LIFF ID
var ID_TOKEN='';                     // ②才有值
/**
 * 快取指紋。**不可以直接用 TOKEN**——②的 TOKEN 是空字串，同一台裝置上
 * 不同人會共用 `''` 這個指紋（本頁快取裡有未回覆者姓名與意見）。②改用 LINE 的 `sub`。
 */
var FP=TOKEN;

function freshIdToken(){
  if(!(window.liff&&typeof liff.getIDToken==='function'))return '';
  var t=liff.getIDToken();return t?String(t):'';
}
function lineSub(){
  try{var d=liff.getDecodedIDToken();return (d&&d.sub)?String(d.sub):'';}catch(e){return '';}
}
/**
 * 說明目前的身分狀態，掛在 `#meta`（本頁放「載入中…→資料來源說明」的那一列）。
 * ⚠️ 擋住時連 `#content` 的「載入中…」一起換掉——否則紅字下面還寫著「載入中」，那句是假話。
 */
function authBlock(msg,isErr){
  var el=document.getElementById('meta');
  if(el){el.textContent=msg;el.style.color=isErr?'#c00':'#888';}
  if(isErr){var c=document.getElementById('content');if(c)c.innerHTML='';}
}
/** 永遠不 resolve ⇒ 後面的首載整批不會發車。**fail-closed，不是忘了 resolve。** */
function authHalt(msg){authBlock(msg,true);return new Promise(function(){});}

function startAuth(){
  if(TOKEN)return Promise.resolve('token');           // ①舊路
  if(!(window.liff&&typeof liff.init==='function')){
    return authHalt('LINE 的元件沒有載入成功，沒辦法確認您的身分。'
      +'請確認網路正常後重新整理；一直這樣的話請找資訊人員。');
  }
  return liff.init({liffId:LIFF_ID}).then(function(){
    if(!liff.isLoggedIn()){
      authBlock('正在前往 LINE 登入，登入後會自動回到這一頁…',false);
      // #102：這條路上 #content 仍是佔位，但我們**正要離開這一頁**，不是在等資料。
      // 不收掉發條的話，導頁若慢了一步，監看器會把上面那句更具體的話蓋掉。
      if(_loadGuard)clearTimeout(_loadGuard);
      liff.login({redirectUri:location.href});        // 保留 ?act=
      return new Promise(function(){});               // 導頁中，不要發車
    }
    ID_TOKEN=freshIdToken();
    if(!ID_TOKEN){
      return authHalt('已經登入 LINE，但拿不到這一頁需要的憑證。'
        +'這是 LINE 後台的設定問題，重新整理不會好，請找資訊人員。');
    }
    FP=lineSub()||ID_TOKEN;
    return 'line';
  }).catch(function(err){
    return authHalt('確認身分時失敗：'+((err&&err.message)?err.message:String(err)));
  });
}

var AUTH_READY=startAuth();

var CUR='';   // 目前顯示的活動ID
// 開頁時解密該指紋的全部持久快取；cacheGet 在它 resolve 前都讀不到值。
// ⚠️ 排在 AUTH_READY 之後：②的指紋（sub）要登入完才知道。①只差一個微任務。
var CACHE_READY=AUTH_READY.then(function(){return cacheBootstrap(FP);});
// 記住上次看的那場，回訪時先用它的快取秒開（localStorage：跨分頁、關瀏覽器也留著）
function lastAct(){try{return localStorage.getItem('attend:lastAct')||'';}catch(e){return '';}}
function rememberAct(id){try{if(id)localStorage.setItem('attend:lastAct',id);}catch(e){}}

function paint(r){
  var out=renderStatsHtml(r,{fallbackTitle:'活動出席狀況'});
  if(out.titleText)document.getElementById('title').textContent=out.titleText;
  document.getElementById('meta').textContent=out.metaText;
  document.getElementById('content').innerHTML=out.bodyHtml;
  if(!out.ok)return;
  CUR=out.actId;
  rememberAct(CUR);
  var sel=document.getElementById('act-picker');
  if(sel.options.length&&out.actId)sel.value=out.actId;
}

function load(actId){
  if(!actId){
    document.getElementById('meta').textContent='';
    document.getElementById('content').innerHTML='<div class="empty">目前還沒有任何活動。</div>';
    return;
  }
  CUR=actId;
  // 同步先佔位：CACHE_READY 是非同步的（哪怕只晚一個 microtask），不佔位就會有一瞬間空白。
  // 佔位與上發條是同一個動作，所以收在 beginLoading() 裡——分開寫就會有人只做前者。
  beginLoading();
  var cachedP=CACHE_READY.then(function(){
    var cached=cacheGet(N.attend(actId));
    if(cached)paint(cached.value);   // 命中就把佔位換成秒開內容
    return cached;
  });
  // ⚠️ 排在 AUTH_READY 之後（E1b）：②要等登入拿到憑證才能發車；①只差一個微任務。
  AUTH_READY.then(function(){return queueRead(function(){
    return jsonp('getActivityStats',{token:TOKEN,act:actId}).then(function(r){
      return cachedP.then(function(cached){
        return handleVerdict(FP,r).then(function(v){
          // #102：原本這裡是**光禿禿的 return**，收斂完全押在 revokedOverlay() 上——
          // 覆蓋層一旦沒蓋上（它自己的檔頭就記著舊 iOS 把它縮成小白框那次），
          // 底下就是一張停在「載入中…」的畫面。走 paint(r) 讓它跟其他 ok:false 同一個講法；
          // 附帶把覆蓋層底下那份已經畫出來的名單換掉，正是那支覆蓋層想擋的東西。
          if(v==='revoked'){paint(r);return;}
          // 離線：有快取就掛「離線·資料停在…」；⚠️ 完全沒快取時一定要把錯誤訊息畫出來，
          // 否則畫面停在 load() 同步佔位的「載入中…」，永遠不會變、也不會有任何錯誤提示。
          // 寫法對齊 hr-stats.html 同位置（else if(!painted)renderHr(r)）。
          if(v==='offline'){
            if(cached){markOffline(cached.savedAt);markRefreshFail('content',cached.savedAt,r);}
            else{clearRefreshFail('content');paint(r);}
            return;
          }
          return cacheSave(FP,N.attend(actId),r).then(function(){
            // 2026-09-13：原本 `else if(!cached)paint(r)`＝失敗而畫面上是快取時一個字都不說
            if(settleRefresh('content',r,cached)){paint(r);if(r&&r.ok)markOffline(null);}
          });
        });
      });
    });
  });}).catch(chainFailed('切換活動'));   // #102：這條鏈原本一個 .catch 都沒有
}

// 2026-08-19：原本兩支同時發，不串接等待（GAS 每支固定 3 秒起跳，串接＝首屏 6 秒以上）。
// 改成 batch 之後這段舊理由已被取代：batch 比並行更好，不是折衷——並行是兩個 GAS 執行位、
// 一次往返；batch 是一個執行位、一次往返，接線更省。當初沒走 batch 只是因為 batch 機制
// 2026-08-06 才加，比這段程式晚。
// 樂觀那支（getActivityStats）直接問「開放中那場」的統計——多數情況命中，畫面很快就出來；
// 只有在全部活動皆關閉（樂觀那支撲空）時，才退回用清單挑最新一場再問一次。
(function init(){ try{
  if(typeof renderStatsHtml!=='function'){    // stats-view.js 沒載進來＝後面每條路都會拋，先講清楚
    fatal('頁面元件載入失敗，請重新整理。若從主畫面圖示開啟仍不行，請改用 Safari 開一次連結。');
    return;
  }
  var urlAct=q('act');

  var ITEMS = [{ a: 'listActivities' }, { a: 'getActivityStats', p: { act: urlAct || '' } }];
  // ⚠️ 排在 AUTH_READY 之後（E1b）。②登入失敗時它永遠不 resolve ⇒ 不會帶著空憑證送出去。
  var FIRST = AUTH_READY.then(function () { return queueRead(function () {
    return jsonp('batch', { token: TOKEN, list: JSON.stringify(ITEMS) }).then(function (env) {
      return handleVerdict(FP, env).then(function (v) {
        if (v === 'revoked') return { ok: false, _verdict: v };
        if (v === 'offline') return { ok: false, _verdict: v, msg: env.msg };
        return persistBatchSlices(FP, env, ITEMS, nameOfSlice).then(function () {
          return env;
        });
      });
    });
  }); });
  function pick(a) {
    return FIRST.then(function (r) {
      return (r && r.ok && r.results && r.results[a]) || { ok: false, msg: (r && r.msg) || '連線失敗' };
    });
  }
  var pList = pick('listActivities');
  var pFast = pick('getActivityStats');

  // 回訪秒開：先用上次看的那場的快取畫出來，背景再校正
  var seed = urlAct || lastAct();
  // #102：`paint(舊格式快取)` 會拋，而這條鏈的消費端只在 offline 分支 ⇒ 原本是靜默的。
  var bootP = CACHE_READY.then(function () {
    if (!seed) return;
    var c = cacheGet(N.attend(seed));
    if (c) paint(c.value);
  }).catch(chainFailed('回訪快取'));

  // 離線標示：批次請求連不連得上，跟著回訪那筆快取的時間戳走
  FIRST.then(function (env) {
    if (env && env._verdict === 'offline') {
      return bootP.then(function () {
        var c = seed ? cacheGet(N.attend(seed)) : null;
        if (c) markOffline(c.savedAt);
      });
    }
    if (env && env.ok) markOffline(null);
  }).catch(chainFailed('離線標示'));

  pFast.then(function(r){
    if(r&&r.ok){ cacheSave(FP, N.attend(r.activity.id||''), r); paint(r); }
  }).catch(chainFailed('首載統計'));

  pList.then(function(r){
    if(!r||!r.ok){
      if(!CUR){
        document.getElementById('meta').textContent='';
        document.getElementById('content').innerHTML='<div class="empty">'+esc((r&&r.msg)||'連結無效或已失效，請向系統管理者索取新連結。')+'</div>';
        return;
      }
      // 2026-09-13：清單與統計都沒拿到、畫面上那場是回訪快取 ⇒ 說出來（原本靜默）
      return pFast.then(function(fr){
        if(fr&&fr.ok)return;
        var c=cacheGet(N.attend(CUR));
        if(c)markRefreshFail('content',c.savedAt,r);
      });
    }
    var sel=document.getElementById('act-picker');
    if(r.rows.length){
      sel.innerHTML=r.rows.slice().reverse().map(function(a){
        var st=a.status==='開放'?(a.open?'開放中':'已截止'):'已關閉';
        return '<option value="'+esc(a.id)+'">'+esc(a.name)+'（'+st+'・回覆 '+a.replies+'）</option>';
      }).join('');
      sel.style.display='block';   // 不可用 ''：display:none 在 .picker class 上，清行內樣式只會退回 none
      if(CUR)sel.value=CUR;
    }
    return pFast.then(function(fr){
      if(fr&&fr.ok)return;                            // 樂觀那支已命中，不必再打
      load(pickDefaultActivity(r.rows,urlAct));       // 全部關閉 → 挑最新一場
    });
  }).catch(chainFailed('活動清單'));
  // ⚠️ 上面這幾個 .catch **不能只包在下面那個 try 裡**：try/catch 只攔同步拋出，
  //    而這些鏈的每一格都在 .then 的回呼裡跑（非同步）——那正是 #102 的成因。
}catch(e){ fatal('頁面載入失敗（'+((e&&e.message)||e)+'），請重新整理。'); } })();

/** 離線標示：有 savedAt 就掛上去，傳 null 代表連上了、拿掉標示。
 *  掛在 #meta（頁面標題下的 meta 列）——本頁本來就用 id="meta" 放這行
 *  「載入中…→資料來源說明」的字，跟 hr-stats.html 的 #sub 是同一個角色。 */
function markOffline(savedAt) {
  var el = document.getElementById('meta');
  if (!el) return;
  var tag = document.getElementById('offline-tag');
  if (savedAt == null) { if (tag) tag.parentNode.removeChild(tag); return; }
  if (!tag) { tag = document.createElement('span'); tag.id = 'offline-tag';
    tag.setAttribute('style', 'margin-left:8px;color:#b26a00;font-size:13px'); el.appendChild(tag); }
  tag.textContent = offlineLabel(savedAt);
}

// 切回這個分頁就重抓一次（不做定時輪詢，省 GAS 配額）
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&CUR)load(CUR);
});
</script>
<script src="assets/back-to-me.js" defer></script>
<script src="assets/page-version.js" defer></script>
</body></html>
